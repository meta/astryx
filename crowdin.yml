# Crowdin CLI config for the astryx design system.
#
# Sources: packages/core/locales/en.json (react-intl / FormatJS shape:
#   { "<key>": { "defaultMessage": "...", "description": "..." } })
# Targets: packages/core/locales/<lang>.json, one file per translated language.
#
# `skip_untranslated_strings: true` below is PER-FILE (inside the files:
# block), so it applies when the Crowdin CLI runs directly against this
# config. Crowdin's native GitHub integration does not read this per-file
# setting for its own exports — for those to skip untranslated keys the
# same way, the project's own "Skip untranslated strings" export setting
# must stay enabled in Crowdin. Crowdin does not allow combining
# skip_untranslated_strings with skip_untranslated_files ("You cannot skip
# strings and files at the same time"); a zero-percent locale can still land
# as an empty `{}` file, which the Crowdin Translations Validation workflow
# rejects before merge.
#
# This file is also read by Crowdin's native GitHub integration, which
# commits translations directly. By default that integration appends its
# own service text to the commit message, which includes a `[ci skip]`
# marker and prevents this repo's normal PR CI and the Crowdin Translations
# Validation workflow from running on those commits. `commit_message`
# below sets a custom, public-safe message, and `append_commit_message:
# false` stops Crowdin from appending that default text (and its
# `[ci skip]` marker) after it. Connecting that integration included a
# one-time import of the repository's existing translations — a setup
# step, already complete, that is not part of ongoing operation.
#
# Env vars come from the GitHub workflow that sets file-level context; the
# native integration authenticates through its own GitHub OAuth integration:
#   CROWDIN_PROJECT_ID     — repo variable (public)
#   CROWDIN_PERSONAL_TOKEN — repo secret

project_id_env: CROWDIN_PROJECT_ID
api_token_env: CROWDIN_PERSONAL_TOKEN

commit_message: 'New translations for %original_file_name% (%language%)'
append_commit_message: false

preserve_hierarchy: true

files:
  - source: /packages/core/locales/en.json
    translation: /packages/core/locales/%locale%.json
    type: react_intl
    skip_untranslated_strings: true
