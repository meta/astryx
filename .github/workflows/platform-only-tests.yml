# Node tests that only one operating system can run, daily on main. Pull
# request CI runs the Node tests on Linux, where these cases skip:
# - windows: packages/cli/foundation/fs/path-safety.test.mjs, whose drive-path
#   case reads real Windows paths on a real Windows file system;
# - macos: packages/native/src/icons/defaults.test.ts, whose SF Symbols case
#   reads the installed system's symbol catalog.
# Each leg checks out main, installs the workspace, runs only its file in the
# `node` project, and then fails when its platform case did not run (a case
# that skipped would otherwise pass in silence). A red run blocks no pull
# request; the main CI guardian reads it.
name: Platform-only tests

on:
  schedule:
    - cron: '43 6 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  platform-only:
    name: platform-only (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            file: packages/cli/foundation/fs/path-safety.test.mjs
            case: reads Windows drive paths
          - os: macos-latest
            file: packages/native/src/icons/defaults.test.ts
            case: names only SF Symbols the system has
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Run the file
        shell: bash
        env:
          FILE: ${{ matrix.file }}
        # The report goes outside the checkout: the node project's setup fails
        # a run that writes into it.
        run: pnpm exec vitest run --project node "$FILE" --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/platform-only.json"

      - name: Fail when the platform case did not run
        if: always()
        shell: bash
        env:
          CASE: ${{ matrix.case }}
        run: |
          node -e '
            const fs = require("node:fs");
            const want = process.env.CASE;
            const report = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/platform-only.json", "utf8"));
            const results = report.testResults.flatMap(file => file.assertionResults);
            const found = results.find(result => result.title === want);
            const status = found ? found.status : "missing";
            console.log(want + ": " + status);
            process.exit(status === "passed" ? 0 : 1);
          '
