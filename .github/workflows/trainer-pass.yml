# Sets the `astryx/trainer-pass` commit status on each pull request's head.
# A pull request the review bot did not open passes at once. One it opened
# waits ("pending") until the trainer reviews that exact head and sets the
# status to success through the statuses API. A status, unlike a check run,
# is bound to its commit and can be overwritten, so every new head starts
# pending again.
#
# pull_request_target so it can set the status on fork pull requests. It
# checks out nothing and runs no pull-request code; its only permission is
# `statuses: write`.
name: Trainer pass

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: trainer-pass-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  trainer-pass:
    name: Trainer pass status
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - name: Set the trainer-pass status on the head
        uses: actions/github-script@v9
        with:
          script: |
            const BOT = 'astracat-bot[bot]';
            const pr = context.payload.pull_request;
            const fromBot = pr.user?.login === BOT;
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: pr.head.sha,
              context: 'astryx/trainer-pass',
              state: fromBot ? 'pending' : 'success',
              description: fromBot
                ? 'waiting for trainer review of this exact head'
                : 'not an Astracat PR',
            });
            core.info(`astryx/trainer-pass: ${fromBot ? 'pending' : 'success'} on ${pr.head.sha}`);
