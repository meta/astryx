# Main's scheduled checks (spec:AST-030 FR12, FR21, FR24, DEC-11, DEC-15,
# DEC-19). This workflow dispatches, for main's tip:
#
# - ci.yml's canonical release-check, about every three hours and once each
#   weekday at about 06:30 Pacific, before the 08:00 release cut: main's
#   visual/a11y/RTL result, fixed forward on failure (DEC-7, FR24);
# - deploy.yml's full unit run, about hourly: every unit suite of every
#   package, on that exact commit, never cancelled by a push (FR21).
#
# A check covers every merge up to its commit. A push dispatches at once when
# its lane's window has passed, and a quarter-hourly schedule picks up the tip
# a burst of merges left unchecked. A release-check always brings a
# unit run of the same commit, so a release cut has both. A unit run that did
# not complete is run again at once, and the guardian's issue says so. Main's
# fast checks (deploy.yml typecheck, build and export sync) still run for
# every push. The release gate's exact-commit checks are dispatched
# separately and are unchanged.
name: Main heavy lanes

on:
  push:
    branches: ['main']
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions: {}

# One decision at a time, so two pushes cannot both see no recent check.
concurrency:
  group: main-heavy-lanes-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
      # The guardian's issue when a unit run did not complete.
      issues: write
    steps:
      - name: Dispatch main's release-check and full unit run for its tip
        uses: actions/github-script@v9
        env:
          SHA: ${{ github.sha }}
        with:
          script: |
            // Each lane starts at most once in its window; the schedule's
            // quarter-hour cadence adds up to 15 minutes to it.
            const HEAVY_WINDOW_MINUTES = 175;
            const UNIT_WINDOW_MINUTES = 55;
            const BOT = 'github-actions[bot]';
            const {data: branch} = await github.rest.repos.getBranch({...context.repo, branch: 'main'});
            const tip = branch.commit.sha;
            const short = tip.slice(0, 7);
            if (context.eventName === 'push' && tip !== process.env.SHA) {
              core.notice(`main moved past ${process.env.SHA.slice(0, 7)}; the newer push's check covers it.`);
              return;
            }
            // A workflow's runs dispatched on main by the workflow token, which
            // stays a run's actor when a person re-runs it. Newest first.
            const dispatched = async workflow => {
              const {data} = await github.rest.actions.listWorkflowRuns({
                ...context.repo, workflow_id: workflow, event: 'workflow_dispatch', branch: 'main', per_page: 30,
              });
              return data.workflow_runs.filter(run => run.actor?.login === BOT);
            };
            // Whether a lane is due for the tip. A cancelled run was replaced
            // and never ran. A release-check that checked out a newer commit
            // than its name says it was asked to check (a merge landed between
            // the tip read and the dispatch) failed on that and is no check of
            // it; it still holds the window. A unit run tests its own event's
            // commit, so its result is always that commit's.
            const askedFor = run => /^Release check ([0-9a-f]{40})$/.exec(run.display_title ?? '')?.[1];
            const covers = run => run.head_sha === tip && (askedFor(run) ?? tip) === tip;
            const due = (runs, label, WINDOW_MINUTES) => {
              const counted = runs.filter(run => run.conclusion !== 'cancelled');
              if (counted.some(covers)) {
                core.notice(`main's tip ${short} already has a ${label}.`);
                return false;
              }
              const latest = counted.map(run => Date.parse(run.created_at)).sort((a, b) => b - a)[0];
              const minutes = latest == null ? Infinity : (Date.now() - latest) / 60000;
              if (minutes < WINDOW_MINUTES) {
                core.notice(`A ${label} started ${Math.floor(minutes)} minutes ago; the next one, at most ${WINDOW_MINUTES - Math.floor(minutes) + 15} minutes from now, covers ${short}.`);
                return false;
              }
              return true;
            };
            const checks = await dispatched('ci.yml');
            const units = await dispatched('deploy.yml');
            let heavy = due(checks, 'release-check', HEAVY_WINDOW_MINUTES);
            let unit = due(units, 'full unit run', UNIT_WINDOW_MINUTES);

            // The weekday release cut is at 08:00 Pacific: one release-check
            // starts at about 06:30, whatever the window, so it finishes about
            // an hour before the cut (FR24). It is dispatched once a day, for
            // the tip unless the tip already has a check.
            const pacific = Object.fromEntries(
              new Intl.DateTimeFormat('en-US', {
                timeZone: 'America/Los_Angeles', weekday: 'short', hour: 'numeric', minute: 'numeric', hourCycle: 'h23',
                year: 'numeric', month: '2-digit', day: '2-digit',
              }).formatToParts(new Date(Date.now())).map(part => [part.type, part.value]),
            );
            const minuteOfDay = Number(pacific.hour) * 60 + Number(pacific.minute);
            const weekday = !['Sat', 'Sun'].includes(pacific.weekday);
            if (!heavy && weekday && minuteOfDay >= 6 * 60 + 30 && minuteOfDay < 7 * 60 + 30) {
              const today = `${pacific.year}-${pacific.month}-${pacific.day}`;
              const startedToday = checks.some(run => {
                if (run.conclusion === 'cancelled') return false;
                const parts = Object.fromEntries(
                  new Intl.DateTimeFormat('en-US', {
                    timeZone: 'America/Los_Angeles', hour: 'numeric', minute: 'numeric', hourCycle: 'h23',
                    year: 'numeric', month: '2-digit', day: '2-digit',
                  }).formatToParts(new Date(Date.parse(run.created_at))).map(part => [part.type, part.value]),
                );
                return `${parts.year}-${parts.month}-${parts.day}` === today && Number(parts.hour) * 60 + Number(parts.minute) >= 6 * 60 + 30;
              });
              if (!startedToday && !checks.some(run => run.conclusion !== 'cancelled' && covers(run))) {
                core.notice(`The pre-cut release-check runs now for ${short}.`);
                heavy = true;
              }
            }

            // A full unit run that did not complete (FR21): run the next one at
            // once and tell the guardian. A newer run, such as a recheck that
            // replaced it, leaves nothing to do.
            const INCOMPLETE = ['cancelled', 'skipped', 'timed_out', 'startup_failure', 'stale', 'action_required'];
            const newest = units[0];
            if (newest?.status === 'completed' && INCOMPLETE.includes(newest.conclusion)) {
              unit = true;
              const title = 'Main unit tests: an hourly run did not complete';
              const note = `The full unit run ${newest.html_url} for ${newest.head_sha.slice(0, 7)} ended ${newest.conclusion}. The next run was dispatched for ${short}.`;
              const {data: found} = await github.rest.search.issuesAndPullRequests({
                q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "${title}"`,
              });
              const issue = found.items.find(item => item.title === title);
              if (issue) {
                await github.rest.issues.createComment({...context.repo, issue_number: issue.number, body: note});
              } else {
                await github.rest.issues.create({...context.repo, title, body: `${note}\n\nClose this issue once main's full unit runs complete again (spec:AST-030 FR21).`});
              }
              core.warning(note);
            }

            // ci.yml queues release-checks in one group (one running, one
            // waiting; a newer one replaces the waiting one). A merge landing
            // between the tip read above and this call makes the run check out
            // the newer commit and fail its exact-head check; the next dispatch
            // checks that commit.
            if (heavy) {
              await github.rest.actions.createWorkflowDispatch({
                ...context.repo,
                workflow_id: 'ci.yml',
                ref: 'main',
                inputs: {operation: 'release-check', 'release-branch': 'main', 'expected-head': tip},
              });
            }
            // A release-check always brings a full unit run of the same commit,
            // so a release cut from it has both.
            const unitAtTip = units.some(run => run.conclusion !== 'cancelled' && covers(run));
            if (unit || (heavy && !unitAtTip)) {
              await github.rest.actions.createWorkflowDispatch({...context.repo, workflow_id: 'deploy.yml', ref: 'main'});
            }
