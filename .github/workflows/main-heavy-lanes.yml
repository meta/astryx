# Main's scheduled checks (spec:AST-030 FR12, FR21, DEC-11, DEC-15). This
# workflow dispatches, for main's tip and about once an hour each:
#
# - ci.yml's canonical release-check: main's visual/a11y/RTL result, fixed
#   forward on failure (DEC-7, DEC-11);
# - deploy.yml's full unit run: every unit suite of every package, on that
#   exact commit, never cancelled by a push (FR21).
#
# A check covers every merge up to its commit. A push dispatches at once when
# none started in the last 55 minutes, and a quarter-hourly schedule picks up
# the tip a burst of merges left unchecked. A release-check always brings a
# unit run of the same commit, so a release cut has both. A unit run that did
# not complete is run again at once, and the guardian's issue says so. Main's
# fast checks (deploy.yml typecheck, build and export sync) still run for
# every push. The release gate's exact-commit checks are dispatched
# separately and are unchanged.
name: Main heavy lanes

on:
  push:
    branches: ['main']
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions: {}

# One decision at a time, so two pushes cannot both see no recent check.
concurrency:
  group: main-heavy-lanes-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-slim
    # Room for the rate-limit wait (at most five minutes) and the dispatch.
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
      # The guardian's issue when a unit run did not complete.
      issues: write
    steps:
      - name: Dispatch main's release-check and full unit run for its tip
        uses: actions/github-script@v9
        env:
          SHA: ${{ github.sha }}
        with:
          script: |
            // Wait out the repository's shared API rate limit, with the helper
            // read from this workflow's own trusted commit (no checkout). The
            // raw file host spends none of that budget; the API is the fallback.
            {
              const helperPath = '.github/scripts/lib/rate-limit-backoff.cjs';
              let helperSource;
              try {
                const response = await fetch(`https://raw.githubusercontent.com/${context.repo.owner}/${context.repo.repo}/${context.sha}/${helperPath}`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                helperSource = await response.text();
              } catch {
                const {data: helper} = await github.rest.repos.getContent({...context.repo, ref: context.sha, path: helperPath});
                helperSource = Buffer.from(helper.content, 'base64').toString('utf8');
              }
              const helperModule = {exports: {}};
              new Function('module', 'exports', 'require', helperSource)(
                helperModule, helperModule.exports,
                () => { throw new Error('rate-limit-backoff.cjs must stay dependency-free'); },
              );
              helperModule.exports.installRateLimitBackoff({github, core});
            }
            // A check starts at most once in this window; the schedule's
            // quarter-hour cadence adds up to 15 minutes to it.
            const WINDOW_MINUTES = 55;
            const BOT = 'github-actions[bot]';
            const {data: branch} = await github.rest.repos.getBranch({...context.repo, branch: 'main'});
            const tip = branch.commit.sha;
            const short = tip.slice(0, 7);
            if (context.eventName === 'push' && tip !== process.env.SHA) {
              core.notice(`main moved past ${process.env.SHA.slice(0, 7)}; the newer push's check covers it.`);
              return;
            }
            // A workflow's runs dispatched on main, newest first; the workflow
            // token stays a run's actor when a person re-runs it.
            const dispatchedRuns = async workflow => {
              const {data} = await github.rest.actions.listWorkflowRuns({
                ...context.repo, workflow_id: workflow, event: 'workflow_dispatch', branch: 'main', per_page: 30,
              });
              return data.workflow_runs;
            };
            const byBot = runs => runs.filter(run => run.actor?.login === BOT);
            // Whether a lane is due for the tip. A cancelled run was replaced
            // while waiting, or stopped by a release re-check of main's tip,
            // which is itself a full check. A release-check that checked out a newer commit
            // than it was asked to check (a merge landed between the tip read
            // and the dispatch) fails its release-authority job and is no check
            // of that commit; it still holds the window. A unit run counts only
            // for the commit it names (FR21).
            const authorityRefused = async run => {
              const {data: {jobs}} = await github.rest.actions.listJobsForWorkflowRun({
                ...context.repo, run_id: run.id, filter: 'latest', per_page: 100,
              });
              return jobs.some(job => job.name === 'release-authority' && job.conclusion === 'failure');
            };
            // The commit a Main run names (`Main validation of <sha>`, a
            // dispatch with `sha`; FR22).
            // A run without one tests main's tip when it starts, which can be
            // later than its event's commit, so it covers no commit; the
            // release receipt reads the name the same way (FR21).
            const tested = run => /^Main validation of ([0-9a-f]{40})$/.exec(run.display_title ?? '')?.[1] ?? null;
            const covered = async (runs, checkAuthority) => {
              // A release-check (checkAuthority) is of its event commit; a unit run of the commit it names.
              for (const run of runs.filter(item => item.conclusion !== 'cancelled' && (checkAuthority ? item.head_sha : tested(item)) === tip)) {
                if (!checkAuthority || run.status !== 'completed' || run.conclusion === 'success' || !(await authorityRefused(run))) return true;
              }
              return false;
            };
            const due = async (runs, label, checkAuthority, coverRuns = runs) => {
              const counted = runs.filter(run => run.conclusion !== 'cancelled');
              if (await covered(coverRuns, checkAuthority)) {
                core.notice(`main's tip ${short} already has a ${label}.`);
                return false;
              }
              const latest = counted.map(run => Date.parse(run.created_at)).sort((a, b) => b - a)[0];
              const minutes = latest == null ? Infinity : (Date.now() - latest) / 60000;
              if (minutes < WINDOW_MINUTES) {
                core.notice(`A ${label} started ${Math.floor(minutes)} minutes ago; the next one, at most ${WINDOW_MINUTES - Math.floor(minutes) + 15} minutes from now, covers ${short}.`);
                return false;
              }
              return true;
            };
            const allChecks = await dispatchedRuns('ci.yml');
            const allUnits = await dispatchedRuns('deploy.yml');
            const checks = byBot(allChecks);
            const units = byBot(allUnits);
            const heavy = await due(checks, 'release-check', true);
            // A person's run of main's tip covers it too.
            let unit = await due(units, 'full unit run', false, allUnits);

            // A full unit run that did not complete (FR21): run the next one at
            // once and tell the guardian, after the dispatches below. A newer
            // run, such as a recheck that replaced it, leaves nothing to do.
            const INCOMPLETE = ['cancelled', 'skipped', 'timed_out', 'startup_failure', 'stale', 'action_required'];
            // The newest run in the unit-run group, which may have replaced it:
            // every dispatched run but a person's that names a commit, which
            // runs in a group of its own (deploy.yml).
            const named = run => /^Main validation of /.test(run.display_title ?? '');
            const newest = allUnits.find(run => !(named(run) && (run.triggering_actor ?? run.actor)?.login !== BOT));
            // A tip that already has a run naming it is covered: nothing to redo.
            const incomplete = newest?.status === 'completed' && INCOMPLETE.includes(newest.conclusion) && !(await covered(allUnits, false));
            if (incomplete) unit = true;

            // ci.yml queues release-checks in one group (one running, one
            // waiting; a newer one replaces the waiting one). A merge landing
            // between the tip read above and this call makes the run check out
            // the newer commit and fail its exact-head check; the next dispatch
            // checks that commit.
            if (heavy) {
              await github.rest.actions.createWorkflowDispatch({
                ...context.repo,
                workflow_id: 'ci.yml',
                ref: 'main',
                inputs: {operation: 'release-check', 'release-branch': 'main', 'expected-head': tip},
              });
            }
            // A release-check always brings a full unit run of the same commit,
            // so a release cut from it has both: this one, or one a person
            // dispatched for the tip, such as the release owner's own check,
            // while that commit is still the tip. A maintenance capture runs
            // no release-authority job and is not a release-check.
            const unitAtTip = await covered(allUnits, false);
            const isReleaseCheck = async run => {
              const {data: {jobs}} = await github.rest.actions.listJobsForWorkflowRun({
                ...context.repo, run_id: run.id, filter: 'latest', per_page: 100,
              });
              return jobs.some(job => job.name === 'release-authority' && job.conclusion !== 'skipped');
            };
            let personCheckAtTip = false;
            if (!unitAtTip && !unit && !heavy) {
              for (const run of allChecks.filter(item => item.actor?.login !== BOT && item.conclusion !== 'cancelled' && item.head_sha === tip)) {
                if (await isReleaseCheck(run)) {
                  personCheckAtTip = true;
                  break;
                }
              }
            }
            if (unit || ((heavy || personCheckAtTip) && !unitAtTip)) {
              // Named, so the run tests exactly this commit even if main moves
              // before it starts.
              await github.rest.actions.createWorkflowDispatch({...context.repo, workflow_id: 'deploy.yml', ref: 'main', inputs: {sha: tip}});
            }

            if (incomplete) {
              const title = 'Main unit tests: an hourly run did not complete';
              const note = `The full unit run ${newest.html_url} for ${newest.head_sha.slice(0, 7)} ended ${newest.conclusion}. The next run was dispatched for ${short}.`;
              core.warning(note);
              const {data: found} = await github.rest.search.issuesAndPullRequests({
                q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "${title}"`,
              });
              const issue = found.items.find(item => item.title === title);
              if (issue) {
                await github.rest.issues.createComment({...context.repo, issue_number: issue.number, body: note});
              } else {
                await github.rest.issues.create({...context.repo, title, body: `${note}\n\nClose this issue once main's full unit runs complete again (spec:AST-030 FR21).`});
              }
            }
