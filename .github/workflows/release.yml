# Single source of truth for ALL npm publishing of @astryxdesign/* packages to
# the public npm registry, via npm OIDC trusted publishing — no NPM_TOKEN.
#
# IMPORTANT: npm trusted publishing matches the OIDC token's workflow FILENAME
# against the trusted-publisher config. npm allows only ONE trusted publisher per
# package, so BOTH stable and canary publishing MUST live in this one file
# (release.yml) and the npm trust config MUST point at release.yml. If publishing
# were split across two workflow files, only one of them could be trusted and the
# other's publish would be rejected by npm at the OIDC check.
#   Re-point trust with:
#     node scripts/npm/setup-trusted-publishing.mjs --setup-trust --replace --workflow release.yml
#
# Two jobs, selected by trigger:
#   - publish (stable): workflow_dispatch only. Publishes the `latest` dist-tag.
#     The release flow is:
#       1. Cut and mark one release/vX.Y.Z branch from exact window-time main;
#          X.Y.Z is the version main's package.json declares at that commit.
#       2. Target the generated Version Packages PR to that branch. It writes
#          changelogs under that version and never moves it.
#       3. Run the final exact-head release checks, tag the merged bump commit,
#          and dispatch this workflow from that immutable tag with the recorded
#          release branch and head. Stable publication from main is rejected.
#     Version-gated and idempotent: any version already on the registry is
#     skipped, so re-running (or a `dry-run` first) is safe.
#   - canary: push to main only. Main normally declares the next planned version,
#     so this publishes <declared>-canary.<short-sha> to the `canary` dist-tag.
#     The trusted release merge-back briefly leaves main equal to the stable tag;
#     that push publishes no canary and waits for the separate next-plan PR:
#       npm install @astryxdesign/core@canary
#
# Why both jobs live here instead of in deploy.yml:
#   - Single workflow file ⇒ single npm trusted-publisher config covers both.
#   - deploy.yml uses the `pages-deploy` concurrency group, which serializes/
#     cancels on a busy main — that repeatedly starved npm publishing. This
#     workflow keeps publishing off that group entirely.
#   - Each job checks out the exact ref and publishes per package, so the
#     published tarball matches the released commit and carries provenance.
#
# Concurrency is per-JOB (deliberately NOT a single workflow-level group): a
# busy main firing many canary pushes must NEVER cancel or starve a pending
# stable dispatch. Stable and canary therefore use independent concurrency
# groups (see each job below).
#
# Provenance requires a PUBLIC repo (meta/astryx is public).
name: Release
run-name: Release (${{ github.sha }})

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Build and resolve what would publish, but do not publish'
        type: boolean
        default: false
      release-branch:
        description: 'Single marked release/vX.Y.Z branch'
        type: string
        required: true
      release-version:
        description: 'Exact X.Y.Z version recorded by the active marker'
        type: string
        required: true
      release-tag:
        description: 'Exact immutable vX.Y.Z tag checked out by this run'
        type: string
        required: true
      expected-head:
        description: 'Exact full release branch SHA carried by this tag'
        type: string
        required: true
      plan-digest:
        description: 'Exact SHA-256 digest recorded by the active marker'
        type: string
        required: true
  push:
    branches: [main]

permissions: {}

jobs:
  # Stable publish — manual dispatch only. Publishes the `latest` dist-tag.
  publish:
    if: github.event_name == 'workflow_dispatch'
    runs-on: 4-core-ubuntu
    # Dedicated, non-cancelling group. Independent of the canary group so a
    # canary push can never cancel or queue ahead of a stable release.
    concurrency:
      group: npm-release-stable
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # npm OIDC trusted publishing + provenance
    steps:
      - name: Checkout immutable release tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate marked release branch, tag commit, and plan
        env:
          RELEASE_BRANCH: ${{ inputs['release-branch'] }}
          RELEASE_VERSION: ${{ inputs['release-version'] }}
          RELEASE_TAG: ${{ inputs['release-tag'] }}
          EXPECTED_HEAD: ${{ inputs['expected-head'] }}
          PLAN_DIGEST: ${{ inputs['plan-digest'] }}
        run: |
          set -eu
          git fetch origin '+refs/heads/release/v*:refs/remotes/origin/release/v*'
          ACTIVE_BRANCHES=$(node scripts/release/active-release.mjs list-active)
          REMOTE_HEAD=$(git ls-remote origin "refs/heads/$RELEASE_BRANCH" | awk '{print $1}')
          node scripts/release/active-release.mjs validate \
            --mode publish \
            --release-branch "$RELEASE_BRANCH" \
            --release-version "$RELEASE_VERSION" \
            --release-tag "$RELEASE_TAG" \
            --expected-head "$EXPECTED_HEAD" \
            --plan-digest "$PLAN_DIGEST" \
            --checkout-sha "$GITHUB_SHA" \
            --remote-head "$REMOTE_HEAD" \
            --ref-name "$GITHUB_REF_NAME" \
            --active-branches "$ACTIVE_BRANCHES" \
            | tee release-publish-receipt.json

      - name: Upload exact release authority receipt
        uses: actions/upload-artifact@v7
        with:
          name: release-publish-receipt-${{ inputs['expected-head'] }}
          path: release-publish-receipt.json
          retention-days: 90

      - name: Record release authority summary
        run: |
          PLAN_DIGEST=$(node -p "require('./.release/active.json').planDigest")
          {
            echo '## Stable release authority'
            echo
            echo "- Branch: ${{ inputs['release-branch'] }}"
            echo "- Version: ${{ inputs['release-version'] }}"
            echo "- Head: ${{ inputs['expected-head'] }}"
            echo "- Tag: ${{ inputs['release-tag'] }}"
            echo "- Plan digest: $PLAN_DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"

      # registry-url makes setup-node write the auth config `npm publish` reads.
      # The Node line in .nvmrc must stay >= 24 so npm >= 11.5.1 ships with it,
      # which OIDC trusted publishing requires.
      - name: Setup Node and pnpm
        uses: ./.github/actions/setup
        with:
          registry-url: 'https://registry.npmjs.org'

      - name: Build all packages
        run: pnpm build

      - name: Publish changed packages
        env:
          DRY_RUN: ${{ inputs.dry-run }}
          RELEASE_VERSION: ${{ inputs['release-version'] }}
        run: |
          set -eu
          published=0
          for pkg_dir in packages/* packages/themes/*; do
            [ -f "$pkg_dir/package.json" ] || continue
            # Stable `latest` never includes canaryOnly packages (e.g. lab):
            # skip them explicitly so even an accidental `private: false` can
            # never leak them onto the `latest` dist-tag.
            IS_PUBLISHABLE=$(node -p "const p=require('./$pkg_dir/package.json'); !p.private && !p.astryx?.canaryOnly && p.name?.startsWith('@astryxdesign/') ? 'yes' : 'no'")
            [ "$IS_PUBLISHABLE" = "yes" ] || continue
            NAME=$(node -p "require('./$pkg_dir/package.json').name")
            VERSION=$(node -p "require('./$pkg_dir/package.json').version")
            if npm view "$NAME@$VERSION" version --registry https://registry.npmjs.org >/dev/null 2>&1; then
              echo "Skipping $NAME@$VERSION (already on registry)"
              continue
            fi
            if [ "$DRY_RUN" = "true" ]; then
              echo "[dry-run] Would publish $NAME@$VERSION"
              continue
            fi
            echo "Publishing $NAME@$VERSION"
            pnpm publish "./$pkg_dir" --tag latest --provenance --access public --no-git-checks
            published=$((published + 1))
          done
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run complete; no packages were published."
          else
            node scripts/npm/verify-published.mjs \
              --version "$RELEASE_VERSION" \
              --tag latest
            echo "Published $published package(s); registry verification passed."
          fi

  # Canary publish — runs on every push to main. The @canary dist-tag always
  # points to the latest main commit:
  #   npm install @astryxdesign/core@canary
  canary:
    name: Publish canary to npm
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Dedicated group, independent of the stable group, so this can never
    # cancel or starve a stable dispatch. Never cancel in progress: a canary
    # that has started may already have published some packages, and
    # cancelling it mid-loop leaves a partial canary set on npm. Bursts still
    # coalesce: while one canary runs, a newer push waits as the single pending
    # run, and a later push replaces that pending run before it starts.
    concurrency:
      group: npm-release-canary
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # required for npm OIDC trusted publishing + provenance
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide whether main may publish a canary
        id: canary-scope
        run: |
          set -eu
          git fetch origin 'refs/tags/v*:refs/tags/v*'
          node scripts/release/active-release.mjs canary-eligibility

      # registry-url makes setup-node write the auth config `npm publish` reads.
      # The Node line in .nvmrc must stay >= 24 so npm >= 11.5.1 ships with it,
      # which OIDC trusted publishing requires.
      - name: Setup Node and pnpm
        if: steps.canary-scope.outputs.publish == 'true'
        uses: ./.github/actions/setup
        with:
          registry-url: 'https://registry.npmjs.org'

      - name: Build all packages
        if: steps.canary-scope.outputs.publish == 'true'
        run: pnpm build

      - name: Publish canary versions
        if: steps.canary-scope.outputs.publish == 'true'
        # Pure OIDC trusted publishing — no NPM_TOKEN.
        run: |
          set -eu
          SHORT_SHA="${GITHUB_SHA:0:7}"
          # Main's package.json carries the next planned version.
          DECLARED_VERSION=$(node -p "require('./packages/core/package.json').version")
          CANARY_VERSION="${DECLARED_VERSION}-canary.${SHORT_SHA}"

          echo "Publishing canary ${CANARY_VERSION}"

          # Remember which canaryOnly packages were private before this
          # ephemeral checkout removes the guard. Only those packages may be
          # skipped when their npm name has not been bootstrapped yet.
          PRIVATE_CANARY_PACKAGES="$RUNNER_TEMP/astryx-private-canary-packages.txt"
          : > "$PRIVATE_CANARY_PACKAGES"
          export PRIVATE_CANARY_PACKAGES

          # Stamp canary version into all publishable packages. canaryOnly
          # packages (for example Native) stay `private: true` in git as npm's hard
          # guarantee against a stable publish; here — in the ephemeral CI
          # checkout ONLY — we strip `private` so they publish to @canary.
          for pkg in packages/*/package.json packages/themes/*/package.json; do
            node -e "
              const fs = require('fs');
              const p = JSON.parse(fs.readFileSync('$pkg','utf8'));
              if (!p.name?.startsWith('@astryxdesign/')) process.exit(0);
              if (p.private && !p.astryx?.canaryOnly) process.exit(0);
              if (p.private && p.astryx?.canaryOnly) {
                fs.appendFileSync(process.env.PRIVATE_CANARY_PACKAGES, p.name + '\n');
                delete p.private;
              }
              p.version = '${CANARY_VERSION}';
              for (const dt of ['dependencies','peerDependencies','devDependencies']) {
                if (!p[dt]) continue;
                for (const [k,v] of Object.entries(p[dt])) {
                  if (k.startsWith('@astryxdesign/')) p[dt][k] = '${CANARY_VERSION}';
                }
              }
              fs.writeFileSync('$pkg', JSON.stringify(p, null, 2) + '\n');
              console.log('  ' + p.name + ' → ${CANARY_VERSION}');
            "
          done

          # Publish each package with --tag canary. Failures are collected and
          # the job still fails at the end (never `|| true`-swallowed), but one
          # rejected publish no longer aborts the loop: when a private
          # canary-only package's first OIDC publish is rejected because its npm
          # package/trust is not bootstrapped yet, packages after it still need
          # their canaries. Publishes are per-package and idempotent, so attempting
          # the rest is always safe.
          FAILED=""
          for pkg_dir in packages/* packages/themes/*; do
            [ -f "$pkg_dir/package.json" ] || continue
            # canaryOnly packages are publishable here (the stamp step above
            # already stripped their `private` flag in this ephemeral checkout).
            IS_PUBLISHABLE=$(node -p "const p=require('./$pkg_dir/package.json'); (!p.private || p.astryx?.canaryOnly) && p.name?.startsWith('@astryxdesign/') ? 'yes' : 'no'")
            if [ "$IS_PUBLISHABLE" = "yes" ]; then
              NAME=$(node -p "require('./$pkg_dir/package.json').name")
              if grep -Fxq "$NAME" "$PRIVATE_CANARY_PACKAGES"; then
                PACKAGE_URL=$(node -e "process.stdout.write(new URL(encodeURIComponent(process.argv[1]), 'https://registry.npmjs.org/').href)" "$NAME")
                HTTP_STATUS=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 30 "$PACKAGE_URL" || true)
                case "$HTTP_STATUS" in
                  200) ;;
                  404)
                    echo "::notice::Skipping absent private canary-only package ${NAME}; bootstrap it and register release.yml as its trusted publisher."
                    continue
                    ;;
                  *)
                    echo "::error::Registry lookup for ${NAME} returned HTTP ${HTTP_STATUS}"
                    FAILED="${FAILED} ${NAME}"
                    continue
                    ;;
                esac
              fi
              echo "Publishing ${NAME}@${CANARY_VERSION}"
              if ! pnpm publish "./$pkg_dir" --tag canary --provenance --access public --no-git-checks; then
                echo "::error::Canary publish failed for ${NAME}@${CANARY_VERSION}"
                FAILED="${FAILED} ${NAME}"
              fi
            fi
          done

          if [ -n "$FAILED" ]; then
            echo "::error::Canary publish failed for:${FAILED}"
            exit 1
          fi

          echo "Canary published: npm install @astryxdesign/core@${CANARY_VERSION}"

      - name: Prune old canary versions
        if: steps.canary-scope.outputs.publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -eu
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::notice::Skipping canary cleanup because NPM_TOKEN is not configured."
            exit 0
          fi
          node scripts/npm/prune-canaries.mjs --yes
