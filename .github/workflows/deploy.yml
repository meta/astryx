# Validate every push to main. Stable docs, Storybook, and Sandbox deploy through
# the Vercel project; this workflow preserves the post-merge test gates only.
name: Main

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions: {}

concurrency:
  group: 'main-validation'
  cancel-in-progress: false

jobs:
  # Verify package.json exports match the source tree.
  # Fails if exports are stale — run `node scripts/sync-exports.js` locally to fix.
  sync-exports:
    runs-on: ubuntu-slim
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Check package.json exports are in sync
        run: node scripts/sync-exports.js --check

  # The push gate, as three parallel lanes joined by `test` below.
  #
  # This was one job running both Vitest projects, a full `pnpm build`, and
  # eight typecheck gates on a 2-core runner — strictly more than ci.yml's
  # `test`, which was already being terminated around 20 minutes with no
  # summary. Same defect, later surface: main's post-merge gate was over the
  # same budget.
  #
  # Nothing is dropped and nothing runs twice. The two Vitest projects are
  # independent by construction (vitest.config.ts), so they split cleanly; the
  # typecheck gates need the `pnpm build` they follow, so they stay together in
  # their own lane and take the build with them.
  #
  # `ui` is the heavier project by ~4x here, so it takes the larger runner (see
  # ci.yml's lane comment).
  test-ui:
    runs-on: 4-core-ubuntu
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: ./.github/actions/setup

      # Match the PR gate: FR23 needs an idle test runner, not just a new process.
      - name: Run UI tests and isolated Markdown benchmark
        run: |
          pnpm vitest run --project ui --exclude packages/core/src/Markdown/Markdown.fr23.perf.test.ts
          pnpm vitest run --project ui packages/core/src/Markdown/Markdown.fr23.perf.test.ts --no-file-parallelism

  test-node:
    # Vitest runs one test file per CPU beyond the first, so the 2-core runner
    # ran this suite one file at a time (~23 min). Four cores give it three.
    runs-on: 4-core-ubuntu
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: ./.github/actions/setup

      - run: pnpm vitest run --project node

  # Typecheck gates mirroring the PR `build` job in ci.yml. ci.yml only runs
  # on pull_request/merge_group, so a typecheck error can land on main (its
  # push only runs the suite) undetected — then break the `build` check on
  # every open PR, which typechecks the PR merged with main (see #3197).
  # Running them here closes that gap and blocks a broken deploy.
  typecheck:
    runs-on: 2-core-ubuntu-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: ./.github/actions/setup

      - run: pnpm build

      - name: Verify package exports
        run: node scripts/verify-exports.mjs

      - name: Typecheck component docs
        run: pnpm -F @astryxdesign/core typecheck:docs

      - name: Typecheck lab docs
        run: pnpm -F @astryxdesign/lab typecheck:docs

      - name: Typecheck charts docs
        run: pnpm -F @astryxdesign/charts typecheck:docs

      - name: Typecheck rich text docs
        run: pnpm -F @astryxdesign/richtext typecheck:docs

      - name: Typecheck Vega docs
        run: pnpm -F @astryxdesign/vega typecheck:docs

      - name: Typecheck template docs
        run: pnpm -F @astryxdesign/cli typecheck:template-docs

      # Full-package strict checkJs over the CLI (src, bin, scripts, docs, and
      # the emitted templates). Requires the `pnpm build` above so the template
      # .tsx sources can resolve the built @astryxdesign/{core,charts,lab} types.
      - name: Typecheck CLI (strict)
        run: pnpm -F @astryxdesign/cli typecheck:strict

      - name: Typecheck storybook
        run: pnpm -F @astryxdesign/storybook typecheck

      - name: Typecheck core (including tests)
        run: pnpm -F @astryxdesign/core typecheck

      # The other component packages' own sources and tests, like core's: their
      # typecheck:docs gates above cover only their .doc.mjs files.
      - name: Typecheck lab (including tests)
        run: pnpm -F @astryxdesign/lab typecheck

      - name: Typecheck charts (including tests)
        run: pnpm -F @astryxdesign/charts typecheck

      - name: Typecheck rich text (including tests)
        run: pnpm -F @astryxdesign/richtext typecheck

      - name: Typecheck Vega (including tests)
        run: pnpm -F @astryxdesign/vega typecheck

      # The accessibility spec-test contracts are consumed as TypeScript source
      # by Vitest and Playwright, and neither runner typechecks. This is the
      # only gate over them.
      - name: Typecheck accessibility spec-test contracts
        run: pnpm -F @astryxdesign/a11y-spec typecheck

  # Stable join for the three post-merge validation lanes.
  test:
    needs: [test-ui, test-node, typecheck]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-slim
    permissions: {}
    steps:
      - name: Assert every push gate succeeded
        run: |
          echo "test-ui:    ${{ needs.test-ui.result }}"
          echo "test-node:  ${{ needs.test-node.result }}"
          echo "typecheck:  ${{ needs.typecheck.result }}"
          [ "${{ needs.test-ui.result }}" = "success" ] || exit 1
          [ "${{ needs.test-node.result }}" = "success" ] || exit 1
          [ "${{ needs.typecheck.result }}" = "success" ] || exit 1
