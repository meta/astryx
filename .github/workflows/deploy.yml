# Validate every push to main. Stable docs, Storybook, and Sandbox deploy through
# the Vercel project; this workflow preserves the post-merge test gates only.
name: Main
# A run that validates an older commit is named for it, so it never reads as a
# check of main's tip; every other run keeps its default name.
run-name: "${{ github.event_name == 'workflow_dispatch' && inputs.sha != '' && format('Main validation of {0}', inputs.sha) || '' }}"

on:
  push:
    branches: ['main']
  workflow_dispatch:
    inputs:
      sha:
        description: 'Full SHA of a commit in main history to validate; empty validates main tip'
        type: string
        required: false
      recheck:
        description: "Release re-check of main's tip, sent by the release re-check workflow: takes the validation group at once"
        type: boolean
        default: false

permissions: {}

# One validation of main at a time; a newer one waits and replaces any older
# waiting one. A dispatch that names `sha` validates an older commit in a group
# of its own, so it never replaces or cancels main's validations. Only a release
# re-check, which the release re-check workflow sends with the workflow token
# and without `sha`, cancels the running validation: it is itself a full
# validation of main's tip, so the cancelled run's commits stay covered
# (spec:AST-030 FR22).
concurrency:
  group: "${{ github.event_name == 'workflow_dispatch' && inputs.sha != '' && format('main-validation-sha-{0}', github.run_id) || 'main-validation' }}"
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' && inputs.recheck && inputs.sha == '' && github.triggering_actor == 'github-actions[bot]' }}

jobs:
  # The one commit every lane and leg of this run tests. A push validates the
  # pushed commit; a dispatch, its `sha` input when given (it must be in main's
  # history), else main's tip when it starts. Each leg resolving
  # `main` itself could straddle a merge, shard different file lists, and skip
  # a file in every leg.
  main-commit:
    runs-on: ubuntu-slim
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Resolve the commit under test
        id: resolve
        uses: actions/github-script@v9
        with:
          script: |
            let sha = context.sha;
            if (context.eventName !== 'push') {
              const {data} = await github.rest.repos.getBranch({...context.repo, branch: 'main'});
              sha = data.commit.sha;
              // Not trimmed: the concurrency group reads the raw input, so a
              // value of only spaces must fail here, not validate the tip.
              const requested = context.payload.inputs?.sha ?? '';
              if (requested !== '') {
                if (!/^[0-9a-f]{40}$/.test(requested)) {
                  throw new Error(`sha must be a full 40-character commit SHA, got "${requested}".`);
                }
                const {data: comparison} = await github.rest.repos.compareCommitsWithBasehead({
                  ...context.repo,
                  basehead: `${requested}...${sha}`,
                });
                if (!['identical', 'ahead'].includes(comparison.status)) {
                  throw new Error(`${requested} is not in main's history.`);
                }
                // The typecheck lane keeps this commit's size records, which
                // needs main's size-record scripts (the commit of #9164 and
                // later); an older commit cannot run that lane.
                const FLOOR = 'f0039ff70521b4f51a2a64ea15f2b687e6374482';
                const {data: since} = await github.rest.repos.compareCommitsWithBasehead({
                  ...context.repo,
                  basehead: `${FLOOR}...${requested}`,
                });
                if (!['identical', 'ahead'].includes(since.status)) {
                  throw new Error(`${requested} predates the size records this run's typecheck lane keeps; validate a later commit.`);
                }
                sha = requested;
              }
            }
            core.setOutput('sha', sha);

      # Marks a release re-check, so the re-check workflow can tell its runs
      # from main's hourly check of the same commit.
      - name: Mark a release re-check
        if: github.event_name == 'workflow_dispatch' && inputs.recheck
        run: echo 'Release re-check'

  # Verify package.json exports match the source tree.
  # Fails if exports are stale — run `node scripts/sync-exports.js` locally to fix.
  sync-exports:
    needs: [main-commit]
    runs-on: ubuntu-slim
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.main-commit.outputs.sha }}

      - name: Check package.json exports are in sync
        run: node scripts/sync-exports.js --check

  # The push gate, as three parallel lanes joined by `test` below.
  #
  # This was one job running both Vitest projects, a full `pnpm build`, and
  # every package typecheck on a 2-core runner — strictly more than ci.yml's
  # `test`, which was already being terminated around 20 minutes with no
  # summary. Same defect, later surface: main's post-merge gate was over the
  # same budget.
  #
  # Nothing is dropped and nothing runs twice. The two Vitest projects are
  # independent by construction (vitest.config.ts), so they split cleanly; the
  # typecheck needs the `pnpm build` it follows, so they stay together in
  # their own lane and take the build with them.
  #
  # Both Vitest lanes split into legs that all run at once, with no
  # max-parallel hold: a validation of main may cost more runner-minutes to
  # finish sooner, so the release train can re-check a fix within minutes
  # (spec:AST-030 FR22, DEC-17). At four legs each, test-node's slowest leg took ~8 minutes
  # and test-ui's ~6. Six legs each bring every leg near the typecheck lane
  # (~5 minutes); the leg that holds the longest Node test file (~6 minutes on
  # its own) sets the floor, and more legs would not move it. `test` joins the
  # legs.
  test-ui:
    needs: [main-commit]
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.main-commit.outputs.sha }}

      - uses: ./.github/actions/setup

      - name: Run this shard of the UI tests
        run: pnpm test:ui --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      # Match the PR gate: FR23 needs an idle test runner, not just a new
      # process, so one leg runs it after its own share has exited.
      - name: Run the isolated Markdown benchmark
        if: matrix.shard == 1
        run: pnpm test:ui:isolated

  test-node:
    needs: [main-commit]
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    # Vitest runs one test file per CPU beyond the first, so the 2-core runner
    # ran this suite one file at a time (~23 min). Four cores give it three.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.main-commit.outputs.sha }}

      - uses: ./.github/actions/setup

      - run: pnpm test:node --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  # The typecheck mirroring the PR `build` job in ci.yml. ci.yml only runs
  # on pull_request/merge_group, so a typecheck error can land on main (its
  # push only runs the suite) undetected — then break the `build` check on
  # every open PR, which typechecks the PR merged with main (see #3197).
  # Running them here closes that gap and blocks a broken deploy.
  typecheck:
    needs: [main-commit]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.main-commit.outputs.sha }}

      - uses: ./.github/actions/setup

      - run: pnpm build

      # A pull request reads its merge base's component sizes from this record
      # instead of building the base (ci.yml build-storybook).
      - name: Record component sizes
        run: node .github/scripts/analyze-pr.js --main-record --output component-size.json

      - name: Keep this commit's component sizes for PR size reports
        uses: actions/upload-artifact@v7
        with:
          name: component-size-main-${{ needs.main-commit.outputs.sha }}
          path: component-size.json
          retention-days: 14

      # A pull request compares its published package sizes with its merge
      # base's from this measurement (ci.yml build-storybook).
      - name: Measure published package size
        run: node .github/scripts/package-size.mjs measure --output package-size.json

      - name: Keep this commit's package size for PR size reports
        uses: actions/upload-artifact@v7
        with:
          name: package-size-main-${{ needs.main-commit.outputs.sha }}
          path: package-size.json
          retention-days: 14

      - name: Verify package exports
        run: node scripts/verify-exports.mjs

      # Every workspace package's own `typecheck` script, as in ci.yml.
      - name: Typecheck every package
        run: pnpm typecheck

  # Stable join for the three post-merge validation lanes.
  test:
    needs: [test-ui, test-node, typecheck]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-slim
    permissions: {}
    steps:
      - name: Assert every push gate succeeded
        run: |
          echo "test-ui:    ${{ needs.test-ui.result }}"
          echo "test-node:  ${{ needs.test-node.result }}"
          echo "typecheck:  ${{ needs.typecheck.result }}"
          [ "${{ needs.test-ui.result }}" = "success" ] || exit 1
          [ "${{ needs.test-node.result }}" = "success" ] || exit 1
          [ "${{ needs.typecheck.result }}" = "success" ] || exit 1
