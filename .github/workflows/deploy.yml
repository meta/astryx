# Validate every push to main. Stable docs, Storybook, and Sandbox deploy through
# the Vercel project; this workflow preserves the post-merge test gates only.
name: Main
# A run that validates an older commit is named for it, so it never reads as a
# check of main's tip; every other run keeps its default name.
run-name: "${{ github.event_name == 'workflow_dispatch' && inputs.sha != '' && format('Main validation of {0}', inputs.sha) || '' }}"

on:
  push:
    branches: ['main']
  workflow_dispatch:
    inputs:
      sha:
        description: "Full SHA of a commit in main's history from #9164 on to validate; empty validates main's tip"
        type: string
        required: false
      recheck:
        description: "Release re-check of main's tip, sent by the release re-check workflow: takes the validation group at once"
        type: boolean
        default: false

permissions: {}

# Push runs (the fast checks) share one group, and a newer push replaces an
# older waiting one. Full unit runs have a group of their own that no push
# cancels: the scheduler's (main-heavy-lanes.yml, which names the commit) and a
# person's run of main's tip queue there, one at a time (spec:AST-030 FR21).
# A person's dispatch that names an older `sha` validates it in a group of its
# own, so it never replaces or cancels another run. Only a release re-check,
# which the release re-check workflow sends with the workflow token, naming
# main's tip, cancels the running unit run: it is itself a full validation of
# that commit, so the cancelled run's commits stay covered (spec:AST-030 FR22).
concurrency:
  group: "${{ github.event_name == 'push' && 'main-validation' || (inputs.sha != '' && github.triggering_actor != 'github-actions[bot]' && format('main-validation-sha-{0}', github.run_id)) || 'main-unit-tests' }}"
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' && inputs.recheck && github.triggering_actor == 'github-actions[bot]' }}

jobs:
  # The one commit every lane and leg of this run tests. A push validates the
  # pushed commit; a dispatch, its `sha` input when given (it must be in main's
  # history), else main's tip when it starts. Each leg resolving
  # `main` itself could straddle a merge, shard different file lists, and skip
  # a file in every leg.
  main-commit:
    # Its admission wait may outlast a slim job's fifteen-minute cap, so it
    # runs on a standard runner (spec:AST-030 DEC-16).
    runs-on: ubuntu-latest
    timeout-minutes: 130
    permissions:
      # actions: read lets the admission step count CI's live jobs.
      actions: read
      contents: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Resolve the commit under test
        id: resolve
        uses: actions/github-script@v9
        with:
          script: |
            let sha = context.sha;
            if (context.eventName !== 'push') {
              const {data} = await github.rest.repos.getBranch({...context.repo, branch: 'main'});
              sha = data.commit.sha;
              // Not trimmed: the concurrency group reads the raw input, so a
              // value of only spaces must fail here, not validate the tip.
              const requested = context.payload.inputs?.sha ?? '';
              if (requested !== '') {
                if (!/^[0-9a-f]{40}$/.test(requested)) {
                  throw new Error(`sha must be a full 40-character commit SHA, got "${requested}".`);
                }
                const {data: comparison} = await github.rest.repos.compareCommitsWithBasehead({
                  ...context.repo,
                  basehead: `${requested}...${sha}`,
                });
                if (!['identical', 'ahead'].includes(comparison.status)) {
                  throw new Error(`${requested} is not in main's history.`);
                }
                // The typecheck lane keeps this commit's size records, which
                // needs main's size-record scripts (the commit of #9164 and
                // later); an older commit cannot run that lane.
                const FLOOR = 'f0039ff70521b4f51a2a64ea15f2b687e6374482';
                const {data: since} = await github.rest.repos.compareCommitsWithBasehead({
                  ...context.repo,
                  basehead: `${FLOOR}...${requested}`,
                });
                if (!['identical', 'ahead'].includes(since.status)) {
                  throw new Error(`${requested} predates the size records this run's typecheck lane keeps; validate a later commit.`);
                }
                sha = requested;
              }
            }
            core.setOutput('sha', sha);

      # Marks a release re-check, so the re-check workflow can tell its runs
      # from main's hourly check of the same commit.
      - name: Mark a release re-check
        if: github.event_name == 'workflow_dispatch' && inputs.recheck
        run: echo 'Release re-check'

      # A `main` full check waits for room under CI's ceiling before its legs
      # start (spec:AST-030 FR16, DEC-16); every other job here needs this one.
      # `peak` is the most jobs this run holds at once (ci-admission.test.mjs).
      - name: Check out the admission action
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions/ci-admission
          path: .ci-admission
          persist-credentials: false

      - name: Wait for room under the CI ceiling
        uses: ./.ci-admission/.github/actions/ci-admission
        continue-on-error: true
        timeout-minutes: 125
        with:
          # A push runs only the fast checks (main-commit, sync-exports,
          # typecheck, test); a dispatched unit run holds every leg.
          peak: ${{ github.event_name == 'push' && 4 || 14 }}
          main: true
          # It waits for room, up to its own job's limit, looking about every
          # four minutes, and never yields to a pull-request run.
          max-wait-minutes: 120
          max-looks: 30

  # Verify package.json exports match the source tree.
  # Fails if exports are stale — run `node scripts/sync-exports.js` locally to fix.
  sync-exports:
    needs: [main-commit]
    runs-on: ubuntu-slim
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.main-commit.outputs.sha }}

      - name: Check package.json exports are in sync
        run: node scripts/sync-exports.js --check

  # The push gate, as three parallel lanes joined by `test` below.
  #
  # This was one job running both Vitest projects, a full `pnpm build`, and
  # every package typecheck on a 2-core runner — strictly more than ci.yml's
  # `test`, which was already being terminated around 20 minutes with no
  # summary. Same defect, later surface: main's post-merge gate was over the
  # same budget.
  #
  # Nothing is dropped and nothing runs twice. The two Vitest projects are
  # independent by construction (vitest.config.ts), so they split cleanly; the
  # typecheck needs the `pnpm build` it follows, so they stay together in
  # their own lane and take the build with them.
  #
  # Both Vitest lanes split into legs that all run at once, with no
  # max-parallel hold: a validation of main may cost more runner-minutes to
  # finish sooner, so the release train can re-check a fix within minutes
  # (spec:AST-030 FR22, DEC-17). At four legs each, test-node's slowest leg took ~8 minutes
  # and test-ui's ~6. Six legs each bring every leg near the typecheck lane
  # (~5 minutes); the leg that holds the longest Node test file (~6 minutes on
  # its own) sets the floor, and more legs would not move it. `test` joins the
  # legs.
  # The unit lanes run the full suites only in a dispatched run (about hourly,
  # from main-heavy-lanes.yml; spec:AST-030 FR21), never on a push.
  test-ui:
    needs: [main-commit]
    if: github.event_name != 'push'
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.main-commit.outputs.sha }}

      - uses: ./.github/actions/setup

      - name: Run this shard of the UI tests
        run: pnpm test:ui --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      # Match the PR gate: FR23 needs an idle test runner, not just a new
      # process, so one leg runs it after its own share has exited.
      - name: Run the isolated Markdown benchmark
        if: matrix.shard == 1
        run: pnpm test:ui:isolated

  test-node:
    needs: [main-commit]
    if: github.event_name != 'push'
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    # Vitest runs one test file per CPU beyond the first, so the 2-core runner
    # ran this suite one file at a time (~23 min). Four cores give it three.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Two commits: the swizzle proof diffs main's squash-merged commit
      # against its parent to prove only the copies that change affects
      # (spec:AST-110 FR7).
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.main-commit.outputs.sha }}
          fetch-depth: 2

      - uses: ./.github/actions/setup

      # A release re-check also renders every swizzle copy in Chromium.
      - name: Install Chromium for the swizzle proof
        if: inputs.recheck
        run: npx playwright install chromium

      # The full run records what each Node test file touches, for the record
      # a pull request selects its file-reading tests by (scripts/test-inputs,
      # spec:AST-030 FR13). Each leg's JSON results name the files that fail.
      - name: Run this shard of the Node tests, recording their inputs
        run: |
          mkdir -p "$ASTRYX_TEST_INPUTS_DIR"
          pnpm test:node --shard=${{ matrix.shard }}/${{ strategy.job-total }} \
            --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/node-results.json"
        env:
          ASTRYX_TEST_INPUTS_DIR: ${{ runner.temp }}/node-test-inputs
          # A release re-check proves every swizzle target, in Chromium too
          # (spec:AST-110 FR7).
          SWIZZLE_PROOF_ALL: ${{ inputs.recheck && '1' || '' }}
          SWIZZLE_PROOF_BROWSER: ${{ inputs.recheck && '1' || '' }}

      - name: Keep this leg's recorded inputs
        uses: actions/upload-artifact@v7
        with:
          name: node-test-inputs-leg-${{ matrix.shard }}
          path: ${{ runner.temp }}/node-test-inputs
          retention-days: 1

      - name: Keep this leg's results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: node-results-leg-${{ matrix.shard }}
          path: ${{ runner.temp }}/node-results.json
          if-no-files-found: ignore
          retention-days: 7

  # After the Node legs (scripts/test-inputs, spec:AST-030 FR13, DEC-30):
  # when they all passed, merges their lines into this commit's test-inputs
  # record and keeps it for pull requests (a failed leg may not have recorded
  # all its files' inputs); when one failed, names any pull request merged
  # since the last passing full run that left a failed test out, and opens an
  # issue, so a wrong skip shows within the hour.
  node-test-inputs:
    needs: [main-commit, test-node]
    if: always() && github.event_name != 'push' && (needs.test-node.result == 'success' || needs.test-node.result == 'failure')
    # A full run's lines took 3.5 GB to merge, more than a slim runner holds
    # and near Node's default heap; the heap gets twice that.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.main-commit.outputs.sha }}
          persist-credentials: false

      - name: Download every leg's recorded inputs
        if: needs.test-node.result == 'success'
        uses: actions/download-artifact@v8
        with:
          pattern: node-test-inputs-leg-*
          path: ${{ runner.temp }}/legs

      - name: Merge the legs into the record
        if: needs.test-node.result == 'success'
        run: |
          mkdir -p "$RUNNER_TEMP/record"
          node --max-old-space-size=7168 scripts/test-inputs/merge.mjs --out "$RUNNER_TEMP/record/record.json" "$RUNNER_TEMP"/legs/*

      - name: Keep the record for pull requests
        if: needs.test-node.result == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: node-test-inputs
          path: ${{ runner.temp }}/record/record.json
          retention-days: 7

      - name: Download every leg's results
        if: needs.test-node.result == 'failure'
        uses: actions/download-artifact@v8
        with:
          pattern: node-results-leg-*
          path: ${{ runner.temp }}/results

      - name: Name failed tests that a merged pull request left out
        if: needs.test-node.result == 'failure'
        uses: actions/github-script@v9
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.main-commit.outputs.sha }}
          RESULTS: ${{ runner.temp }}/results
        with:
          retries: 3
          script: |
            const {skippedFailures} = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/lib/skipped-test-alarm.cjs`);
            const found = await skippedFailures({github, ...context.repo, sha: process.env.SHA, results: process.env.RESULTS, runId: context.runId});
            if (found.length === 0) {
              core.info('No failed test was left out by a pull request merged since the last passing full run.');
              return;
            }
            const lines = found.map(({test, pr}) => `- \`${test}\` failed on main; #${pr} left it out by its recorded inputs.`);
            for (const line of lines) core.error(line.slice(2));
            const title = 'A test that a pull request left out failed on main';
            const body = `${lines.join('\n')}\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nThe record missed an input of these tests (scripts/test-inputs). Fix the record or the rule that read it, then close this issue.`;
            const {data: open} = await github.rest.issues.listForRepo({...context.repo, state: 'open', creator: 'github-actions[bot]', per_page: 100});
            const existing = open.find(issue => issue.title === title);
            if (existing) await github.rest.issues.createComment({...context.repo, issue_number: existing.number, body});
            else await github.rest.issues.create({...context.repo, title, body});

  # The typecheck mirroring the PR `build` job in ci.yml. ci.yml only runs
  # on pull_request/merge_group, so a typecheck error can land on main (its
  # push only runs the suite) undetected — then break the `build` check on
  # every open PR, which typechecks the PR merged with main (see #3197).
  # Running them here closes that gap and blocks a broken deploy.
  typecheck:
    needs: [main-commit]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.main-commit.outputs.sha }}

      - uses: ./.github/actions/setup

      - run: pnpm build

      # A pull request reads its merge base's component sizes from this record
      # instead of building the base (ci.yml build-storybook).
      - name: Record component sizes
        run: node .github/scripts/analyze-pr.js --main-record --output component-size.json

      - name: Keep this commit's component sizes for PR size reports
        uses: actions/upload-artifact@v7
        with:
          name: component-size-main-${{ needs.main-commit.outputs.sha }}
          path: component-size.json
          retention-days: 14

      # A pull request compares its published package sizes with its merge
      # base's from this measurement (ci.yml build-storybook).
      - name: Measure published package size
        run: node .github/scripts/package-size.mjs measure --output package-size.json

      - name: Keep this commit's package size for PR size reports
        uses: actions/upload-artifact@v7
        with:
          name: package-size-main-${{ needs.main-commit.outputs.sha }}
          path: package-size.json
          retention-days: 14

      # A pull request's API changes compare its head's build with this
      # surface of its merge base (ci.yml build-storybook), so a committed
      # report main forgot to regenerate never shows as a pull request's rows
      # (architecture:public-component-api INV24). Evidence only: it never
      # fails this job.
      - name: Record the published API surface
        continue-on-error: true
        run: node scripts/api-report/cli.mjs --surface api-surface

      - name: Keep this commit's API surface for PR API changes
        if: hashFiles('api-surface/surface.json') != ''
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: api-surface-main-${{ needs.main-commit.outputs.sha }}
          path: api-surface/
          retention-days: 14

      - name: Verify package exports
        run: node scripts/verify-exports.mjs

      # Every workspace package's own `typecheck` script, as in ci.yml.
      - name: Typecheck every package
        run: pnpm typecheck

  # Stable join for the three post-merge validation lanes.
  test:
    needs: [test-ui, test-node, typecheck]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-slim
    permissions: {}
    steps:
      # A push runs only the fast checks; a dispatched run is the full unit
      # run, and passes only when every unit leg passed.
      - name: Assert every push gate succeeded
        env:
          EVENT: ${{ github.event_name }}
          TEST_UI: ${{ needs.test-ui.result }}
          TEST_NODE: ${{ needs.test-node.result }}
          TYPECHECK: ${{ needs.typecheck.result }}
        run: |
          echo "test-ui:    $TEST_UI"
          echo "test-node:  $TEST_NODE"
          echo "typecheck:  $TYPECHECK"
          [ "$TYPECHECK" = success ] || exit 1
          if [ "$EVENT" = push ]; then
            [ "$TEST_UI" = skipped ] && [ "$TEST_NODE" = skipped ] || exit 1
          else
            [ "$TEST_UI" = success ] && [ "$TEST_NODE" = success ] || exit 1
          fi
