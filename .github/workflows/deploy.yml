# Validate every push to main. Stable docs, Storybook, and Sandbox deploy through
# the Vercel project; this workflow preserves the post-merge test gates only.
name: Main

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions: {}

concurrency:
  group: 'main-validation'
  cancel-in-progress: false

jobs:
  # The one commit every lane and leg of this run tests. A push validates the
  # pushed commit; a dispatch, main's tip when it starts. Each leg resolving
  # `main` itself could straddle a merge, shard different file lists, and skip
  # a file in every leg.
  main-commit:
    runs-on: ubuntu-slim
    permissions:
      # The lane decision reads main's last passing validation run.
      actions: read
      contents: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      test_ui: ${{ steps.lanes.outputs.test_ui }}
      test_node: ${{ steps.lanes.outputs.test_node }}
    steps:
      - name: Resolve the commit under test
        id: resolve
        uses: actions/github-script@v9
        with:
          script: |
            let sha = context.sha;
            if (context.eventName !== 'push') {
              const {data} = await github.rest.repos.getBranch({...context.repo, branch: 'main'});
              sha = data.commit.sha;
            }
            core.setOutput('sha', sha);

      # The Vitest lanes skip what a pull request's skip (spec:AST-030 FR13,
      # DEC-13): test-ui for a spec, docsite or Node-tooling change and
      # test-node for a spec or docsite change. The change is everything since
      # main's last passing validation, so a commit whose run was replaced
      # while waiting is still counted. The classifier is the commit's own.
      - name: Check out the change classifier
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.resolve.outputs.sha }}
          sparse-checkout: |
            .github/scripts/change-scope.cjs
            .github/scripts/knowledge-paths.cjs
            scripts/component-packages.cjs
          sparse-checkout-cone-mode: false
          path: .main-scope
          persist-credentials: false

      - name: Decide the Vitest lanes
        id: lanes
        uses: actions/github-script@v9
        env:
          SHA: ${{ steps.resolve.outputs.sha }}
        with:
          retries: 3
          script: |
            const path = require('node:path');
            const lanes = (ui, node) => {
              core.setOutput('test_ui', String(ui));
              core.setOutput('test_node', String(node));
            };
            if (context.eventName !== 'push') {
              core.info(`${context.eventName}: every lane runs.`);
              return lanes(true, true);
            }
            try {
              const sha = process.env.SHA;
              const {data} = await github.rest.actions.listWorkflowRuns({
                ...context.repo, workflow_id: 'deploy.yml', branch: 'main', event: 'push', status: 'success', per_page: 20,
              });
              const last = data.workflow_runs.find(run => run.id !== context.runId && run.head_sha !== sha);
              if (last == null) {
                core.info('No passing validation of main to compare with: every lane runs.');
                return lanes(true, true);
              }
              const {data: comparison} = await github.rest.repos.compareCommitsWithBasehead({
                ...context.repo, basehead: `${last.head_sha}...${sha}`,
              });
              const files = comparison.files ?? [];
              // GitHub lists at most 300 files in a comparison.
              if (comparison.status !== 'ahead' || files.length === 0 || files.length >= 300) {
                core.info(`The change since ${last.head_sha} cannot be listed whole: every lane runs.`);
                return lanes(true, true);
              }
              const {classifyChanges} = require(path.join(process.env.GITHUB_WORKSPACE, '.main-scope/.github/scripts/change-scope.cjs'));
              const scope = classifyChanges(files);
              const ui = !(scope.specOnly || scope.docsiteOnly || scope.toolingOnly);
              const node = !(scope.specOnly || scope.docsiteOnly);
              if (!ui || !node) {
                core.notice(`Since main's last passing validation (${last.head_sha.slice(0, 7)}) only ${scope.specOnly ? 'spec records' : scope.docsiteOnly ? 'the docsite' : 'Node tooling'} changed: ${!ui && !node ? 'test-ui and test-node skip' : 'test-ui skips'}.`);
              }
              return lanes(ui, node);
            } catch (error) {
              core.warning(`The change since main's last passing validation could not be classified (${error.message}): every lane runs.`);
              return lanes(true, true);
            }

  # Verify package.json exports match the source tree.
  # Fails if exports are stale — run `node scripts/sync-exports.js` locally to fix.
  sync-exports:
    runs-on: ubuntu-slim
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Check package.json exports are in sync
        run: node scripts/sync-exports.js --check

  # The push gate, as three parallel lanes joined by `test` below.
  #
  # This was one job running both Vitest projects, a full `pnpm build`, and
  # every package typecheck on a 2-core runner — strictly more than ci.yml's
  # `test`, which was already being terminated around 20 minutes with no
  # summary. Same defect, later surface: main's post-merge gate was over the
  # same budget.
  #
  # Nothing is dropped and nothing runs twice. The two Vitest projects are
  # independent by construction (vitest.config.ts), so they split cleanly; the
  # typecheck needs the `pnpm build` it follows, so they stay together in
  # their own lane and take the build with them.
  #
  # Both Vitest lanes split into four legs, as in ci.yml: one job each ran
  # test-ui in ~18 minutes and test-node in ~28, so main's gate took about half
  # an hour while the PR gate took under fifteen. `test` joins the legs.
  test-ui:
    needs: [main-commit]
    if: needs.main-commit.outputs.test_ui != 'false'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.main-commit.outputs.sha }}

      - uses: ./.github/actions/setup

      - name: Run this shard of the UI tests
        run: pnpm test:ui --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      # Match the PR gate: FR23 needs an idle test runner, not just a new
      # process, so one leg runs it after its own share has exited.
      - name: Run the isolated Markdown benchmark
        if: matrix.shard == 1
        run: pnpm test:ui:isolated

  test-node:
    needs: [main-commit]
    if: needs.main-commit.outputs.test_node != 'false'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # Vitest runs one test file per CPU beyond the first, so the 2-core runner
    # ran this suite one file at a time (~23 min). Four cores give it three.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.main-commit.outputs.sha }}

      - uses: ./.github/actions/setup

      - run: pnpm test:node --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  # The typecheck mirroring the PR `build` job in ci.yml. ci.yml only runs
  # on pull_request/merge_group, so a typecheck error can land on main (its
  # push only runs the suite) undetected — then break the `build` check on
  # every open PR, which typechecks the PR merged with main (see #3197).
  # Running them here closes that gap and blocks a broken deploy.
  typecheck:
    needs: [main-commit]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.main-commit.outputs.sha }}

      - uses: ./.github/actions/setup

      - run: pnpm build

      # A pull request measures its merge base's component sizes from this
      # build instead of building the base again (ci.yml size-base).
      - name: Keep this commit's package builds for PR size reports
        uses: actions/upload-artifact@v7
        with:
          name: dists-main-${{ needs.main-commit.outputs.sha }}
          path: |
            packages/*/dist/
            packages/themes/*/dist/
          retention-days: 14

      # A pull request compares its published package sizes with its merge
      # base's from this measurement (ci.yml build-storybook).
      - name: Measure published package size
        run: node .github/scripts/package-size.mjs measure --output package-size.json

      - name: Keep this commit's package size for PR size reports
        uses: actions/upload-artifact@v7
        with:
          name: package-size-main-${{ needs.main-commit.outputs.sha }}
          path: package-size.json
          retention-days: 14

      - name: Verify package exports
        run: node scripts/verify-exports.mjs

      # Every workspace package's own `typecheck` script, as in ci.yml.
      - name: Typecheck every package
        run: pnpm typecheck

  # Stable join for the three post-merge validation lanes.
  test:
    needs: [main-commit, test-ui, test-node, typecheck]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-slim
    permissions: {}
    steps:
      # A lane the change does not reach is skipped by decision; any other
      # result than success fails the join.
      - name: Assert every push gate succeeded
        env:
          TEST_UI: ${{ needs.test-ui.result }}
          TEST_NODE: ${{ needs.test-node.result }}
          TYPECHECK: ${{ needs.typecheck.result }}
          RUN_UI: ${{ needs.main-commit.outputs.test_ui }}
          RUN_NODE: ${{ needs.main-commit.outputs.test_node }}
        run: |
          echo "test-ui:    $TEST_UI (runs: $RUN_UI)"
          echo "test-node:  $TEST_NODE (runs: $RUN_NODE)"
          echo "typecheck:  $TYPECHECK"
          ok() { [ "$1" = success ] || { [ "$2" = false ] && [ "$1" = skipped ]; }; }
          ok "$TEST_UI" "$RUN_UI" || exit 1
          ok "$TEST_NODE" "$RUN_NODE" || exit 1
          [ "$TYPECHECK" = success ] || exit 1
