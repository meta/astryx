# Keeps the recorded Node test times (scripts/vitest-node-durations.json)
# fresh from main's own runs. The Node legs book a file with no recorded time
# at the ninetieth percentile, so a stale record costs leg balance only, and
# no pull request fails on it. When fewer than nine in ten of the Node
# project's test files have a recorded time, this regenerates the record from
# the Node legs of main's latest successful full unit run and opens one
# durations-only pull request on a fixed branch, or force-updates that branch
# and refreshes the open one (.github/scripts/node-record-refresh.mjs). It
# never pushes to main.
#
# A push or pull request made with the workflow token starts no workflow, so
# CI on the refresh pull request starts when someone with write access
# reopens it.
name: Node test record refresh

on:
  schedule:
    # Every six hours. Main's full unit run is about hourly, so a regenerated
    # record is at most a few hours behind main's test files, and a tick that
    # finds the record fresh stops after one check.
    - cron: '41 */6 * * *'
  workflow_dispatch:

permissions: {}

# One refresh at a time, so two ticks never race on the branch.
concurrency:
  group: node-record-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Reads main's runs and their logs.
      actions: read
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Check the recorded share of Node test files
        id: check
        run: node .github/scripts/node-record-refresh.mjs check --github-output

      # Main's Node legs are named `test-node (N)`, which the recorder reads;
      # it ignores every other job's lines.
      - name: Regenerate the record from main's latest full unit run
        id: record
        if: steps.check.outputs.fresh == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy.yml --branch main --event workflow_dispatch --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -z "$run" ]; then
            echo "::error title=No run to record from::main has no successful full unit run."
            exit 1
          fi
          gh run view "$run" --repo "$GITHUB_REPOSITORY" --log > "$RUNNER_TEMP/main-run.log"
          node scripts/vitest-shard-sequencer.mjs record "$RUNNER_TEMP/main-run.log"
          echo "run_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run" >> "$GITHUB_OUTPUT"
          if git diff --quiet -- scripts/vitest-node-durations.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push the record to the refresh branch and open or refresh its pull request
        if: steps.record.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ steps.check.outputs.share }}
          RUN_URL: ${{ steps.record.outputs.run_url }}
        run: |
          git add scripts/vitest-node-durations.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit --quiet -m 'ci: refresh the recorded Node test times'
          git push --force origin HEAD:refs/heads/ci/node-durations-refresh
          node .github/scripts/node-record-refresh.mjs pr --run-url "$RUN_URL" --before "$BEFORE"
