# WebKit's full interaction suite, weekly on main (spec:AST-030 DEC-24). A
# release runs the full suite at its own commit; this weekly run finds a
# WebKit failure on main between releases. Sunday 10:00 UTC leaves a day to
# fix a red result forward before Monday's release. ci.yml's `webkit-weekly`
# operation runs only the Storybook build, the WebKit legs and the WebKit
# accessibility contracts (report-only), at main's exact tip, and records a
# green or failed verdict from the legs.
name: WebKit weekly

on:
  schedule:
    - cron: '0 10 * * 0'
  workflow_dispatch:

permissions: {}

jobs:
  dispatch:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch the full WebKit run for main's tip
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run ci.yml --ref main -f operation=webkit-weekly
