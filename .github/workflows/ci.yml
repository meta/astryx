            packages/core/src/DropdownMenu/__tests__/DropdownMenuRadioGroupAudit.a11y.chromium.spec.ts \
            --project chromium || status=1
          exit "$status"

      - name: Upload DropdownMenuRadioGroup audit evidence
        if: always() && github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, '[Component Audit] DropdownMenuRadioGroup:')
        uses: actions/upload-artifact@v7
        with:
          name: dropdown-menu-radio-group-audit-evidence-${{ needs.build-storybook.outputs.short_hash }}
          path: |
            dropdown-menu-radio-group-a11y-report.json
            dropdown-menu-radio-group-audit-evidence/
          retention-days: 30
          if-no-files-found: error

      # DropdownMenuRadioItem owns one menuitemradio row: its checked state,
      # decorative radio marker, icon, description, end content, disabled
      # paint, and composition of caller handlers with row activation. The
      # group owns value propagation; DropdownMenu owns keyboard navigation.
      - name: Run DropdownMenuRadioItem audit browser evidence
        if: ${{ !cancelled() && github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, '[Component Audit] DropdownMenuRadioItem:') }}
        env:
          ASTRYX_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          node .github/scripts/accessibility-audit.js \
            --storybook-dir apps/storybook/dist \
            --output dropdown-menu-radio-item-a11y-report.json \
            --components DropdownMenuRadioItem \
            --baseline .github/a11y-baseline.json \
            --fail-on-new || status=1
          pnpm exec playwright test \
            packages/core/src/DropdownMenu/__tests__/DropdownMenuRadioItemAudit.a11y.chromium.spec.ts \
            --project chromium || status=1
          exit "$status"

      - name: Upload DropdownMenuRadioItem audit evidence
        if: always() && github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, '[Component Audit] DropdownMenuRadioItem:')
        uses: actions/upload-artifact@v7
        with:
          name: dropdown-menu-radio-item-audit-evidence-${{ needs.build-storybook.outputs.short_hash }}
          path: |
            dropdown-menu-radio-item-a11y-report.json
            dropdown-menu-radio-item-audit-evidence/
          retention-days: 30
          if-no-files-found: error

      # DropdownMenuSubMenu owns one menuitem row that reveals its own rows: the
      # popup state and wiring, the flyout beside the row, the drilled-in view,
      # the caret or spinner, and disabled paint. DropdownMenu owns the root
      # surface, the drill-in stack, and root keyboard navigation.
      - name: Run DropdownMenuSubMenu audit browser evidence
        if: ${{ !cancelled() && github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, '[Component Audit] DropdownMenuSubMenu:') }}
        env:
          ASTRYX_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          node .github/scripts/accessibility-audit.js \
            --storybook-dir apps/storybook/dist \
            --output dropdown-menu-submenu-a11y-report.json \
            --components DropdownMenuSubMenu \
            --baseline .github/a11y-baseline.json \
            --fail-on-new || status=1
          pnpm exec playwright test \
            packages/core/src/DropdownMenu/__tests__/DropdownMenuSubMenuAudit.a11y.chromium.spec.ts \
            --project chromium || status=1
          exit "$status"

      - name: Upload DropdownMenuSubMenu audit evidence
        if: always() && github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, '[Component Audit] DropdownMenuSubMenu:')
        uses: actions/upload-artifact@v7
        with:
          name: dropdown-menu-submenu-audit-evidence-${{ needs.build-storybook.outputs.short_hash }}
          path: |
            dropdown-menu-submenu-a11y-report.json
            dropdown-menu-submenu-audit-evidence/
          retention-days: 30
          if-no-files-found: error

      # ContextMenu owns pointer and touch presentations across cursor anchoring,
      # selectable rows, sections, inline triggers, RTL, and narrow viewports.
      # Its audit lane binds the rendered matrix to the exact pull-request head.
      - name: Run ContextMenu audit browser evidence
        if: ${{ !cancelled() && github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, '[Component Audit] ContextMenu:') }}
        env:
          ASTRYX_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          node .github/scripts/accessibility-audit.js \
            --storybook-dir apps/storybook/dist \
            --output context-menu-a11y-report.json \
            --components ContextMenu \
            --baseline .github/a11y-baseline.json \
            --fail-on-new || status=1
          pnpm exec playwright test \
            packages/core/src/ContextMenu/__tests__/ContextMenuAudit.a11y.chromium.spec.ts \
            --project chromium || status=1
          exit "$status"

      - name: Upload ContextMenu audit evidence
        if: always() && github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, '[Component Audit] ContextMenu:')
        uses: actions/upload-artifact@v7
        with:
          name: context-menu-audit-evidence-${{ needs.build-storybook.outputs.short_hash }}
          path: |
            context-menu-a11y-report.json
            context-menu-audit-evidence/
          retention-days: 30
          if-no-files-found: error

      # ComplexSelector's whole-component audit grades the rendered state matrix,
      # caller-rendered trigger anchor/focus behavior, RTL, and 320px reflow from
      # exact-head Chromium receipts. Keep this with the existing pr-a11y owner.
      - name: Run ComplexSelector audit browser evidence
        if: ${{ !cancelled() && github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, '[Component Audit] ComplexSelector:') }}
        env:
          ASTRYX_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          node .github/scripts/accessibility-audit.js \
            --storybook-dir apps/storybook/dist \
            --output complex-selector-a11y-report.json \
            --components ComplexSelector \
            --baseline .github/a11y-baseline.json \
            --fail-on-new || status=1
          pnpm exec playwright test \
            packages/core/src/ComplexSelector/__tests__/ComplexSelector.a11y.chromium.spec.ts \
            --project chromium || status=1
          exit "$status"

      - name: Upload ComplexSelector audit evidence
        if: always() && github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, '[Component Audit] ComplexSelector:')
        uses: actions/upload-artifact@v7
        with:
          name: complex-selector-audit-evidence-${{ needs.build-storybook.outputs.short_hash }}
          path: |
            complex-selector-a11y-report.json
            test-results/complex-selector-audit-evidence/
          retention-days: 30
          if-no-files-found: error

      # ContextMenuItem opens from a pointer gesture after the trigger renders.
      # The focused selector wait binds axe to the open menu rather than letting
      # the trigger's first frame satisfy generic Storybook readiness.
      - name: Run ContextMenuItem audit browser evidence
        if: github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, '[Component Audit] ContextMenuItem:')
        env:
          ASTRYX_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node .github/scripts/accessibility-audit.js \
            --storybook-dir apps/storybook/dist \
            --output context-menu-item-a11y-report.json \
            --components ContextMenuItem \
            --ready-selector '[role="menu"]' \
            --baseline .github/a11y-baseline.json \
            --fail-on-new

      - name: Upload ContextMenuItem audit evidence
        if: always() && github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, '[Component Audit] ContextMenuItem:')
        uses: actions/upload-artifact@v7
        with:
          name: context-menu-item-audit-evidence-${{ needs.build-storybook.outputs.short_hash }}
          path: context-menu-item-a11y-report.json
          retention-days: 30
          if-no-files-found: error

      # Drawer audit evidence covers modal/non-modal, both logical sides,
      # root-owned RTL, purpose, narrow widths, custom theming, padding, and
      # sibling stacking. Axe and the sensor matrix both run even if one fails.
      - name: Run Drawer audit browser evidence
        if: ${{ !cancelled() && github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, '[Component Audit] Drawer:') }}
        env:
          ASTRYX_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          node .github/scripts/accessibility-audit.js \
            --storybook-dir apps/storybook/dist \
            --output drawer-a11y-report.json \
            --components Drawer \
            --baseline .github/a11y-baseline.json \
            --fail-on-new || status=1
          pnpm exec playwright test \
            packages/core/src/Drawer/__tests__/DrawerAudit.a11y.chromium.spec.ts \
            --project chromium || status=1
          exit "$status"

      - name: Upload Drawer audit evidence
        if: always() && github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, '[Component Audit] Drawer:')
        uses: actions/upload-artifact@v7
        with:
          name: drawer-audit-evidence-${{ needs.build-storybook.outputs.short_hash }}
          path: |
            drawer-a11y-report.json
            test-results/drawer-audit-evidence/
          retention-days: 30
          if-no-files-found: error

      # DrawerHeader audit evidence proves its title row, numeric ReactNode slot
      # values, close action, direction, theme, focus, and narrow reflow on the
      # exact PR head. Axe and the sensor matrix both run if either one fails.
      - name: Run DrawerHeader audit browser evidence
        if: ${{ !cancelled() && github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, '[Component Audit] DrawerHeader:') }}
        env:
          ASTRYX_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          node .github/scripts/accessibility-audit.js \
            --storybook-dir apps/storybook/dist \
            --output drawer-header-a11y-report.json \
            --components DrawerHeader \
            --baseline .github/a11y-baseline.json \
            --fail-on-new || status=1
          pnpm exec playwright test \
            packages/core/src/Drawer/__tests__/DrawerHeaderAudit.a11y.chromium.spec.ts \
            --project chromium || status=1
          exit "$status"

      - name: Upload DrawerHeader audit evidence
        if: always() && github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, '[Component Audit] DrawerHeader:')
        uses: actions/upload-artifact@v7
        with:
          name: drawer-header-audit-evidence-${{ needs.build-storybook.outputs.short_hash }}
          path: |
            drawer-header-a11y-report.json
            test-results/drawer-header-audit-evidence/
          retention-days: 30
          if-no-files-found: error

      # DateInput's open-state audit story uses a play function to open the
      # popover. Restricting this focused pass to that story lets the selector
      # wait bind axe to the Calendar dialog without making every DateInput story
      # require an open overlay. The receipt spec then captures rest, focus,
      # busy, disabled, status, and open states across the popover, native, and
      # bottom-sheet surfaces, themes, direction, pointers, and viewport.
      - name: Run DateInput audit browser evidence
        if: ${{ !cancelled() && github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, '[Component Audit] DateInput:') }}
        env:
          ASTRYX_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          node .github/scripts/accessibility-audit.js \
            --storybook-dir apps/storybook/dist \
            --output date-input-a11y-report.json \
            --components DateInput \
            --stories core-dateinput--open-calendar-audit \
            --ready-selector '[role="dialog"]' \
            --baseline .github/a11y-baseline.json \
            --fail-on-new || status=1
          pnpm exec playwright test \
            packages/core/src/DateInput/__tests__/DateInputAudit.a11y.chromium.spec.ts \
            --project chromium || status=1
          exit "$status"

      - name: Upload DateInput audit evidence
        if: always() && github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, '[Component Audit] DateInput:')
        uses: actions/upload-artifact@v7
        with:
          name: date-input-audit-evidence-${{ needs.build-storybook.outputs.short_hash }}
          path: |
            date-input-a11y-report.json
            date-input-audit-evidence/
          retention-days: 30
          if-no-files-found: error

      # The CheckboxList and CheckboxListItem component audits grade the same
      # option rows: interactive row paint, focus, busy, disabled, read-only,
      # status, narrow, forced-colors, and RTL states from exact-head Chromium
      # receipts. The shared checkbox contract also runs for its
      # CheckboxListItem bindings, with its own output directory so it cannot
      # clear the receipts. Each lane runs even when another fails, and the
      # step still runs after an earlier audit step fails, so a failing-before
      # head banks complete evidence.
      - name: Run CheckboxList audit browser evidence
        if: ${{ !cancelled() && github.event_name == 'pull_request' && (startsWith(github.event.pull_request.title, '[Component Audit] CheckboxList:') || startsWith(github.event.pull_request.title, '[Component Audit] CheckboxListItem:')) }}
        env:
          ASTRYX_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: checkbox-list-pattern-results.json
        run: |
          status=0
          node .github/scripts/accessibility-audit.js \
            --storybook-dir apps/storybook/dist \
            --output checkbox-list-a11y-report.json \
            --components CheckboxList,CheckboxListItem \
            --baseline .github/a11y-baseline.json \
            --fail-on-new || status=1
          pnpm exec playwright test \
            packages/core/src/CheckboxInput/__tests__/Checkbox.a11y.chromium.spec.ts \
            --project chromium \
            --grep 'CheckboxListItem \[' \
            --output checkbox-list-pattern-output \
            --reporter=list,json || status=1
          pnpm exec playwright test \
            packages/core/src/CheckboxList/__tests__/CheckboxList.a11y.chromium.spec.ts \
            --project chromium || status=1
          exit "$status"

      - name: Upload CheckboxList audit evidence
        if: always() && github.event_name == 'pull_request' && (startsWith(github.event.pull_request.title, '[Component Audit] CheckboxList:') || startsWith(github.event.pull_request.title, '[Component Audit] CheckboxListItem:'))
        uses: actions/upload-artifact@v7
        with:
          name: checkbox-list-audit-evidence-${{ needs.build-storybook.outputs.short_hash }}
          path: |
            checkbox-list-a11y-report.json
            checkbox-list-pattern-results.json
            test-results/checkbox-list-audit-evidence/
          retention-days: 30
          if-no-files-found: error

  # Release-only accessibility contracts run beside pr-a11y instead of after
  # its full axe sweep, so the release check waits for the longer of the two
  # rather than their sum. release-check requires this job as it requires
  # pr-a11y.
  a11y-contracts-shard:
    name: Accessibility spec-test contracts (${{ matrix.shard }}/${{ strategy.job-total }})
    needs: [build-storybook, check-components]
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'release-check' && needs.check-components.outputs.has_components == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    # One core per worker: on two cores, four workers starved the CPU-bound
    # "every expectation" specs past their timeouts.
    runs-on: 4-core-ubuntu
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup
        with:
          install: 'false'

      - name: Download Storybook artifact
        uses: actions/download-artifact@v8
        with:
          name: storybook-${{ needs.build-storybook.outputs.short_hash }}
          path: apps/storybook/dist

      - name: Install Playwright
        run: pnpm install --frozen-lockfile && npx playwright install chromium

      # The exhaustive contract/fixture matrix. PRs retain scoped axe
      # validation and the fast interaction guards in pr-a11y; they must not
      # pay for every component's browser bindings on every change.
      - name: Run accessibility spec-test contracts
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'release-check'
        env:
          ASTRYX_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          A11Y_CONTRACT_WORKERS: 4
        # Files are split by recorded duration (a11y-contract-shard.mjs), not
        # Playwright's count-based --shard; every listed file runs in one leg.
        run: |
          set -euo pipefail
          node .github/scripts/a11y-contract-shard.mjs --shard "${{ matrix.shard }}/${{ strategy.job-total }}" > contract-files.txt
          mapfile -t FILES < contract-files.txt
          # The filters come before the options: `--project` takes every
          # value after it, so filters placed after it read as project names.
          pnpm exec playwright test "${FILES[@]}" --config playwright.config.ts --project chromium

      - name: Upload pressed-state pixel evidence
        if: always() && github.event_name == 'workflow_dispatch' && inputs.operation == 'release-check'
        uses: actions/upload-artifact@v7
        with:
          name: pressed-state-evidence-${{ needs.build-storybook.outputs.short_hash }}-${{ matrix.shard }}
          path: test-results/pressed-state-evidence/
          # A failing run keeps its evidence here (the join merges only after
          # every leg passed, then deletes these copies).
          retention-days: 30
          # Only the shard that ran the spec has frames; the join requires them.
          if-no-files-found: ignore

      # Component-audit browser evidence. A whole-component audit has to show
      # the states it graded, and the audit node cannot always run a browser —
      # so the frames and their sensor receipts are produced here, bound to the
      # same exact head as every other check in this job.
      - name: Upload component-audit browser evidence
        if: always() && github.event_name == 'workflow_dispatch' && inputs.operation == 'release-check'
        uses: actions/upload-artifact@v7
        with:
          name: component-audit-evidence-${{ needs.build-storybook.outputs.short_hash }}-${{ matrix.shard }}
          path: test-results/chat-layout-audit-evidence/
          retention-days: 30
          if-no-files-found: ignore

  # Joins the contract shards for release-check: every shard must pass, and
  # each evidence set is rebuilt under its usual artifact name. A set no shard
  # produced fails the merge, as the single job's upload used to fail.
  a11y-contracts:
    name: Accessibility spec-test contracts
    needs: [build-storybook, check-components, a11y-contracts-shard]
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.operation == 'release-check' && needs.check-components.outputs.has_components == 'true' }}
    runs-on: ubuntu-slim
    permissions: {}
    steps:
      - name: Require every contract shard
        env:
          SHARD_RESULT: ${{ needs.a11y-contracts-shard.result }}
        run: |
          if [ "$SHARD_RESULT" != success ]; then
            echo "Accessibility contract shards did not all succeed: $SHARD_RESULT"
            exit 1
          fi

      - name: Join pressed-state pixel evidence
        uses: actions/upload-artifact/merge@v7
        with:
          name: pressed-state-evidence-${{ needs.build-storybook.outputs.short_hash }}
          pattern: pressed-state-evidence-${{ needs.build-storybook.outputs.short_hash }}-*
          retention-days: 30
          delete-merged: true

      - name: Join component-audit browser evidence
        uses: actions/upload-artifact/merge@v7
        with:
          name: component-audit-evidence-${{ needs.build-storybook.outputs.short_hash }}
          pattern: component-audit-evidence-${{ needs.build-storybook.outputs.short_hash }}-*
          retention-days: 30
          delete-merged: true

  # Build package test owner. The plugin's production CSS partition is a Build
  # integration contract: source inspection cannot prove which declaration
  # paints after Vite emits the final bundle. The `test-build` name makes that
  # package ownership explicit; the historical `test` join above projects its
  # result. Until runtime:build has a specialized route, broad CI dispatches it.
  test-build:
    needs: [check-scope]
    if: github.event_name != 'workflow_dispatch' && needs.check-scope.outputs.docsite_only != 'true' && needs.check-scope.outputs.spec_only != 'true' && needs.check-scope.outputs.tooling_only != 'true'
    runs-on: 2-core-ubuntu-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Verify packed consumer dependency contract
        run: pnpm vitest run packages/build/src/packed-consumer.test.mjs --project node --maxWorkers=1

      - name: Install Playwright
        run: npx playwright install chromium

      # The guard imports the plugin's build artifact, the same one a consumer
      # installs.
      - name: Build the Vite plugin
        run: pnpm -F @astryxdesign/build build

      - name: Run Build CSS-layer cascade guard
        run: node .github/scripts/theme-layer-cascade.js

      # A compile-time ancestor selector on another workspace package's marker
      # (lab's rule on core's indicatorScope) matches in a real browser: see
      # scripts/stylex-module-resolution.cjs.
      - name: Run cross-package StyleX marker browser check
        env:
          ASTRYX_STYLEX_BROWSER: '1'
        run: pnpm vitest run scripts/stylex-module-resolution.browser.test.mjs --project node --maxWorkers=1

  # Guest token boundaries cross portals and the host light/dark cascade. This
  # requires a production browser render; source and jsdom checks cannot prove
  # which custom properties paint the portaled surfaces.
  fixture-contrast:
    needs: [check-scope]
    if: github.event_name != 'workflow_dispatch' && needs.check-scope.outputs.docsite_only != 'true' && needs.check-scope.outputs.spec_only != 'true' && needs.check-scope.outputs.tooling_only != 'true'
    runs-on: 2-core-ubuntu-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Install Playwright
        run: npx playwright install chromium

      - name: Verify canonical setup compositions
        env:
          ASTRYX_CANONICAL_SETUP_BROWSER: '1'
        run: pnpm vitest run internal/vibe-tests/setup-test/setup-canonical.test.ts --project node --maxWorkers=1

      - name: Verify guest fixture contrast
        run: pnpm -F @astryxdesign/vibe-tests fixtures:contrast

  # The full visual plan first loads every Core story to learn which theming
  # targets it renders, and that scout is most of the job's time. It runs here
  # as parallel shards over exactly the release plan's story list; pr-visual
  # joins them only when every shard succeeded, and otherwise scouts inline.
  visual-scout:
    name: Stable visual scout (${{ matrix.shard }}/${{ strategy.job-total }})
    needs: [build-storybook, check-components]
    if: >-
      !cancelled() &&
      needs.build-storybook.result == 'success' &&
      needs.check-components.result == 'success' &&
      ((github.event_name == 'pull_request' &&
        needs.check-components.outputs.has_stable_visual == 'true' &&
        needs.check-components.outputs.broad_stable_visual == 'true') ||
       (github.event_name == 'workflow_dispatch' && inputs.operation == 'release-check'))
    # Five legs: at three, each leg's scout took ~4.5 minutes and the visual
    # regression waited for the slowest one.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    # Four pages on four cores: the scout is page-load bound, and on the rig
    # this cut a shard's scout by a quarter against two pages on two cores.
    runs-on: 4-core-ubuntu
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup
        with:
          install: 'false'

      - name: Download Storybook artifact
        uses: actions/download-artifact@v8
        with:
          name: storybook-${{ needs.build-storybook.outputs.short_hash }}
          path: apps/storybook/dist

      # The artifact carries the themes and the Core dist they import, built
      # at this commit. If it is missing, the gate builds Core and the themes.
      - name: Download built themes and core
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: dists-${{ needs.build-storybook.outputs.short_hash }}
          path: packages

      - name: Install Playwright
        run: pnpm install --frozen-lockfile && npx playwright install chromium

      - name: Scout this shard of the release plan
        run: |
          node .github/scripts/visual-gate/gate.mjs scout \
            --storybook-dir apps/storybook/dist \
            --baseline .github/visual-baseline \
            --shard "${{ matrix.shard }}/${{ strategy.job-total }}" \
            --concurrency 4 \
            --observations-out ".visual-scout/observations-${{ matrix.shard }}.json"

      - name: Upload scout shard
        uses: actions/upload-artifact@v7
        with:
          name: visual-scout-${{ needs.build-storybook.outputs.short_hash }}-${{ matrix.shard }}
          path: .visual-scout/observations-${{ matrix.shard }}.json
          retention-days: 1
          if-no-files-found: error

  # Stable-package visual regression and explicit baseline capture share this
  # owner. Focused PRs compare the checked-in baseline; broad PRs use the full
  # canonical plan. Maintenance captures candidates on the same runner, and a
  # normal reviewed pull request updates the versioned baseline.
  # Audit and interaction fixtures stay with their existing browser checks.
  pr-visual:
    name: Stable visual regression
    needs:
      [build-storybook, check-components, maintenance-request, visual-scout]
    if: >-
      !cancelled() &&
      ((github.event_name == 'pull_request' &&
        needs.build-storybook.result == 'success' &&
        needs.check-components.result == 'success' &&
        needs.check-components.outputs.has_stable_visual == 'true') ||
       (github.event_name == 'workflow_dispatch' &&
        ((inputs.operation == 'release-check' &&
          needs.build-storybook.result == 'success' &&
          needs.check-components.result == 'success') ||
         (needs.maintenance-request.result == 'success' && inputs.operation == 'capture'))))
    runs-on: 2-core-ubuntu-arm
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup
        with:
          install: 'false'

      - name: Download analysis artifact
        if: github.event_name == 'pull_request'
        uses: actions/download-artifact@v8
        with:
          name: pr-analysis

      - name: Download Storybook artifact
        if: github.event_name == 'pull_request' || inputs.operation == 'release-check'
        uses: actions/download-artifact@v8
        with:
          name: storybook-${{ needs.build-storybook.outputs.short_hash }}
          path: apps/storybook/dist

      # The artifact carries the themes and the Core dist they import, built
      # at this commit. If it is missing, the gate builds Core and the themes.
      - name: Download built themes and core
        if: github.event_name == 'pull_request' || inputs.operation == 'release-check'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: dists-${{ needs.build-storybook.outputs.short_hash }}
          path: packages

      # Only a complete set: the gate refuses a partial or mismatched one, and
      # without any it scouts inline as before.
      - name: Download scout shards
        if: (github.event_name == 'pull_request' || inputs.operation == 'release-check') && needs.visual-scout.result == 'success'
        uses: actions/download-artifact@v8
        with:
          pattern: visual-scout-${{ needs.build-storybook.outputs.short_hash }}-*
          path: .visual-scout
          merge-multiple: true

      - name: Install Playwright
        run: pnpm install --frozen-lockfile && npx playwright install chromium

      - name: Build canonical maintenance Storybook
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'capture'
        run: pnpm build && pnpm -F @astryxdesign/storybook build

      # The reviewed baseline is versioned with the code so CI never depends on
      # mutable website storage. Baseline refreshes remain separate reviewable PRs.

      - name: Run the visual gate for the touched components
        id: visual
        if: github.event_name == 'pull_request'
        env:
          BROAD_STABLE_VISUAL: ${{ needs.check-components.outputs.broad_stable_visual }}
          ASTRYX_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ASTRYX_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu
          # Component names are not globally unique; use their package identity.
          COMPONENTS=$(jq -r '. as $root | [(.newComponents + .modifiedComponents)[] | select($root.componentStats[.].package == "@astryxdesign/core")] | unique | join(",")' analysis.json)
          THEMES=$(jq -r '(.changedStableThemes // []) | join(",")' analysis.json)
          COMMAND=check
          if [ "$BROAD_STABLE_VISUAL" = 'true' ]; then
            COMMAND=release
            SCOPE_ARGS=()
          elif [ -n "$COMPONENTS" ] && [ -n "$THEMES" ]; then
            SCOPE_ARGS=(--tiers 'component,theme-matrix' --components "$COMPONENTS" --themes "$THEMES")
          elif [ -n "$COMPONENTS" ]; then
            SCOPE_ARGS=(--tiers component --components "$COMPONENTS" --no-scout)
          elif [ -n "$THEMES" ]; then
            SCOPE_ARGS=(--tiers theme-matrix --themes "$THEMES")
          else
            # Broad changes stay with this owner: the canonical full plan has
            # no focused-component review ceiling and no deferred backup gate.
            COMMAND=release
            SCOPE_ARGS=()
          fi

          echo "Stable Core components: ${COMPONENTS:-none}"
          echo "Stable themes: ${THEMES:-none}"
          OBS_ARGS=()
          if [ -d .visual-scout ]; then OBS_ARGS=(--observation-shards .visual-scout); fi
          set +e
          node .github/scripts/visual-gate/gate.mjs "$COMMAND" \
            --storybook-dir apps/storybook/dist \
            --baseline .github/visual-baseline \
            --out .visual-run \
            "${SCOPE_ARGS[@]}" \
            "${OBS_ARGS[@]}" \
            --summary-output visual-summary.md
          code=$?
          set -e
          # Exit 2 is a visual change for review; every other nonzero exit is
          # an infrastructure failure, not a successful evidence receipt.
          case "$code" in 0|2) ;; *) exit "$code" ;; esac
          STATUS=$(jq -er '.status' .visual-run/verdict.json)
          if [ "$STATUS" = 'skipped' ]; then
            # The focused budget refused before capture. The same owner now
            # captures its bounded canonical full plan rather than leaving a gap.
            set +e
            node .github/scripts/visual-gate/gate.mjs release \
              --storybook-dir apps/storybook/dist \
              --baseline .github/visual-baseline \
              --out .visual-run \
              "${OBS_ARGS[@]}" \
              --summary-output visual-summary.md
            code=$?
            set -e
            case "$code" in 0|2) ;; *) exit "$code" ;; esac
            STATUS=$(jq -er '.status' .visual-run/verdict.json)
          fi
          [ -f visual-summary.md ] && cat visual-summary.md >> "$GITHUB_STEP_SUMMARY"
          case "$STATUS" in
            pass|changed) ;;
            *) echo "Visual evidence is incomplete: $STATUS"; exit 1 ;;
          esac

      - name: Upload visual verdict and report
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: visual-pr-report
          path: |
            .visual-run/verdict.json
            .visual-run/manifest.json
            .visual-run/shots/
            .visual-run/report/
          retention-days: 30
          if-no-files-found: ignore

      - name: Run full release visual check
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'release-check'
        run: |
          set -eu
          OBS_ARGS=()
          if [ -d .visual-scout ]; then OBS_ARGS=(--observation-shards .visual-scout); fi
          set +e
          node .github/scripts/visual-gate/gate.mjs release \
            --storybook-dir apps/storybook/dist \
            --baseline .github/visual-baseline \
            --out .visual-run \
            "${OBS_ARGS[@]}" \
            --summary-output visual-summary.md
          code=$?
          set -e
          case "$code" in 0|2) ;; *) exit "$code" ;; esac
          STATUS=$(jq -er '.status' .visual-run/verdict.json)
          case "$STATUS" in
            pass|changed) ;;
            *) echo "Visual evidence is incomplete: $STATUS"; exit 1 ;;
          esac
          cat visual-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release visual verdict and report
        if: always() && github.event_name == 'workflow_dispatch' && inputs.operation == 'release-check'
        uses: actions/upload-artifact@v7
        with:
          name: visual-release-report
          path: |
            .visual-run/verdict.json
            .visual-run/manifest.json
            .visual-run/shots/
            .visual-run/report/
          retention-days: 14
          if-no-files-found: error

      - name: Capture canonical visual baseline
        id: maintenance-capture
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'capture'
        # A complete browser-refresh capture can be incomparable with the old
        # baseline. The next step requires full capture, not a clean comparison.
        continue-on-error: true
        run: |
          node .github/scripts/visual-gate/gate.mjs release \
            --storybook-dir apps/storybook/dist \
            --baseline .github/visual-baseline \
            --out .visual-run \
            --summary-output visual-summary.md

      - name: Validate canonical baseline capture
        id: maintenance-validation
        if: >-
          always() && github.event_name == 'workflow_dispatch' && inputs.operation == 'capture' &&
          steps.maintenance-capture.outcome != 'skipped'
        env:
          CAPTURE_SHA: ${{ github.sha }}
          CAPTURE_RUN_ID: ${{ github.run_id }}
          CAPTURE_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import {validateVisualMaintenanceCapture} from './.github/scripts/visual-maintenance-source.mjs';
          validateVisualMaintenanceCapture({
            manifest: JSON.parse(fs.readFileSync('.visual-run/manifest.json', 'utf8')),
            verdict: JSON.parse(fs.readFileSync('.visual-run/verdict.json', 'utf8')),
            sha: process.env.CAPTURE_SHA,
            runId: process.env.CAPTURE_RUN_ID,
            runAttempt: process.env.CAPTURE_RUN_ATTEMPT,
          });
          NODE
          cat visual-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload canonical baseline candidate
        if: always() && steps.maintenance-validation.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: visual-baseline-capture-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .visual-run/shots/
            .visual-run/manifest.json
            .visual-run/verdict.json
            .visual-run/report/
          retention-days: 14
          if-no-files-found: error

  # RTL semantic audit. Sibling to pr-a11y: same build-storybook artifact, same
  # analysis.json scoping, so ordinary PRs only pay for the components they
  # touched. A harness-only PR runs the fixed Chart/ChartLegend smoke scope so
  # routing and target changes prove themselves instead of skipping their own
  # check. A policy-sensitive full run spans ~2,000 stories and exceeded the
  # single-job budget, so CI partitions it by canonical package; each shard runs
  # eight browser pages on its four cores (the audit waits on page loads), and
  # the stable pr-rtl join requires all five scope manifests plus a report from
  # every applicable package.
  # The scheduled full sweep also runs in rtl-weekly.yml.
  #
  # Three auto dimensions: D1 icon-mirror, D5 positional-mirror, and D6
  # contextual directional decorations. Curated D2/D3/D4/D7/D8/D9 add
  # behavior and geometry that need selectors. The applicability rollup treats unexplained all-N/A as a
  # coverage gap for both new and existing components.
  #
  # Audit findings remain SOFT while the stability window is observed: the audit
  # step may fail after writing a report. Missing/canceled/incomplete shards are
  # HARD failures, and the pr-rtl join cannot pass without every package scope
  # manifest and every applicable report.
  # To promote findings too, remove the audit step's continue-on-error.
  pr-rtl-shard:
    name: pr-rtl (${{ matrix.package }}${{ matrix.parts > 1 && format(' {0}/{1}', matrix.part, matrix.parts) || '' }})
    needs: [build-storybook, check-components]
    if: >-
      (github.event_name == 'pull_request' ||
       (github.event_name == 'workflow_dispatch' && inputs.operation == 'release-check')) &&
      (needs.check-components.outputs.has_rtl_components == 'true' ||
       needs.check-components.outputs.has_rtl_harness == 'true' ||
       needs.check-components.outputs.force_full_component_audits == 'true')
    # Core is the largest package, so its audit is split three ways
    # (`--shard`) and joined by pr-rtl-merge; every other package runs whole.
    strategy:
      fail-fast: false
      matrix:
        include:
          - {package: core, part: 1, parts: 3}
          - {package: core, part: 2, parts: 3}
          - {package: core, part: 3, parts: 3}
          - {package: lab, part: 1, parts: 1}
          - {package: charts, part: 1, parts: 1}
          - {package: richtext, part: 1, parts: 1}
          - {package: vega, part: 1, parts: 1}
    runs-on: 4-core-ubuntu
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify RTL checkout
        if: github.event_name == 'pull_request'
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup
        with:
          install: 'false'

      - name: Download analysis artifact
        uses: actions/download-artifact@v8
        with:
          name: pr-analysis

      - name: Download Storybook artifact
        uses: actions/download-artifact@v8
        with:
          name: storybook-${{ needs.build-storybook.outputs.short_hash }}
          path: apps/storybook/dist

      - name: Install Playwright
        run: pnpm install --frozen-lockfile && npx playwright install chromium

      # A registry/classifier mutation runs the full audit from the PR checkout,
      # while eligibility itself came from trusted base policy. Scope resolution
      # is strict: malformed or missing analysis fails before the soft findings
      # step can run. An ordinary harness-only change uses the bounded routing
      # smoke scope.
      - name: Resolve RTL shard scope
        id: rtl-scope
        run: |
          node .github/scripts/rtl-shard-scope.mjs \
            --analysis analysis.json \
            --package "${{ matrix.package }}" \
            --force-full "${{ needs.check-components.outputs.force_full_component_audits }}" \
            --has-components "${{ needs.check-components.outputs.has_rtl_components }}" \
            --has-harness "${{ needs.check-components.outputs.has_rtl_harness }}" \
            --manifest rtl-shard-scope.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Run RTL audit
        id: rtl
        if: steps.rtl-scope.outputs.should_run == 'true'
        continue-on-error: true
        run: |
          PACKAGE=${{ matrix.package }}
          COMPONENTS="${{ steps.rtl-scope.outputs.components }}"
          FILTER="${{ steps.rtl-scope.outputs.filter }}"
          FILTER_ARGS=()
          if [ -n "$FILTER" ]; then
            FILTER_ARGS=(--filter "$FILTER")
          fi
          SHARD_ARGS=()
          if [ "${{ matrix.parts }}" -gt 1 ]; then
            SHARD_ARGS=(--shard "${{ matrix.part }}/${{ matrix.parts }}" --shard-output "rtl-shard-${{ matrix.part }}.json")
          fi
          echo "Auditing $PACKAGE components: $COMPONENTS"
          node apps/storybook/rtl-audit/rtl-audit.mjs \
            --storybook-dir apps/storybook/dist \
            --output rtl-audit-report.json \
            --packages "$PACKAGE" \
            "${SHARD_ARGS[@]}" \
            --concurrency 8 \
            "${FILTER_ARGS[@]}"

      - name: Require completed RTL shard report
        if: always()
        run: |
          SCOPE_OUTCOME="${{ steps.rtl-scope.outcome }}"
          SHOULD_RUN="${{ steps.rtl-scope.outputs.should_run }}"
          AUDIT_OUTCOME="${{ steps.rtl.outcome }}"
          if [ "$SCOPE_OUTCOME" != "success" ]; then
            echo "RTL shard scope did not resolve successfully: $SCOPE_OUTCOME"
            exit 1
          fi
          if [ "$SHOULD_RUN" = "true" ]; then
            if [ "$AUDIT_OUTCOME" != "success" ] && [ "$AUDIT_OUTCOME" != "failure" ]; then
              echo "Applicable RTL audit did not run: $AUDIT_OUTCOME"
              exit 1
            fi
            if [ "${{ matrix.parts }}" -gt 1 ]; then
              # A part writes cards only; pr-rtl-merge checks the joined report.
              test -s "rtl-shard-${{ matrix.part }}.json"
            else
              node .github/scripts/rtl-report-completion.mjs \
                --report rtl-audit-report.json \
                --package "${{ matrix.package }}" \
                --filter "${{ steps.rtl-scope.outputs.filter }}"
            fi
          elif [ "$SHOULD_RUN" = "false" ]; then
            if [ "$AUDIT_OUTCOME" != "skipped" ]; then
              echo "Out-of-scope RTL audit unexpectedly ran: $AUDIT_OUTCOME"
              exit 1
            fi
          else
            echo "RTL shard scope produced no explicit should_run decision."
            exit 1
          fi

      - name: Write scorecard summary
        if: always() && steps.rtl-scope.outputs.should_run == 'true' && matrix.parts == 1
        run: |
          node .github/scripts/rtl-scorecard-summary.mjs \
            --report rtl-audit-report.json \
            --scope "${{ steps.rtl-scope.outputs.components }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload RTL shard evidence
        if: always() && matrix.parts == 1
        uses: actions/upload-artifact@v7
        with:
          name: rtl-audit-report-${{ matrix.package }}
          path: |
            rtl-shard-scope.json
            rtl-audit-report.json
          if-no-files-found: error
          retention-days: 1

      - name: Upload RTL part
        if: always() && matrix.parts > 1
        uses: actions/upload-artifact@v7
        with:
          name: rtl-audit-part-${{ matrix.package }}-${{ matrix.part }}
          path: |
            rtl-shard-scope.json
            rtl-shard-${{ matrix.part }}.json
          if-no-files-found: error
          retention-days: 1

  # Joins the Core parts into the one report a whole Core leg would have
  # written (the same scope manifest, report and completion check), uploaded
  # under the same artifact name for the pr-rtl join. A missing or mismatched
  # part fails here.
  pr-rtl-merge:
    name: pr-rtl (core)
    needs: [build-storybook, check-components, pr-rtl-shard]
    if: >-
      always() && !cancelled() &&
      (github.event_name == 'pull_request' ||
       (github.event_name == 'workflow_dispatch' && inputs.operation == 'release-check')) &&
      (needs.check-components.outputs.has_rtl_components == 'true' ||
       needs.check-components.outputs.has_rtl_harness == 'true' ||
       needs.check-components.outputs.force_full_component_audits == 'true')
    runs-on: 2-core-ubuntu-arm
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup

      - name: Download Storybook artifact
        uses: actions/download-artifact@v8
        with:
          name: storybook-${{ needs.build-storybook.outputs.short_hash }}
          path: apps/storybook/dist

      - name: Download Core RTL parts
        uses: actions/download-artifact@v8
        with:
          pattern: rtl-audit-part-core-*
          path: rtl-parts

      - name: Join Core RTL parts
        id: join
        run: |
          set -eu
          manifests=(rtl-parts/*/rtl-shard-scope.json)
          if [ "${#manifests[@]}" -ne 3 ]; then
            echo "Expected 3 Core RTL parts, found ${#manifests[@]}."
            exit 1
          fi
          for manifest in "${manifests[@]}"; do
            cmp -s "$manifest" "${manifests[0]}" || { echo "Core RTL parts disagree on scope: $manifest"; exit 1; }
          done
          cp "${manifests[0]}" rtl-shard-scope.json
          FILTER=$(jq -r '.filter' rtl-shard-scope.json)
          echo "components=${FILTER:-full core roster}" >> "$GITHUB_OUTPUT"
          if [ "$(jq -r '.shouldRun' rtl-shard-scope.json)" != true ]; then
            echo "Core RTL audit not applicable."
            exit 0
          fi
          FILTER_ARGS=()
          if [ -n "$FILTER" ]; then FILTER_ARGS=(--filter "$FILTER"); fi
          set +e
          node apps/storybook/rtl-audit/rtl-audit.mjs \
            --storybook-dir apps/storybook/dist \
            --output rtl-audit-report.json \
            --packages core \
            --merge-shards rtl-parts \
            "${FILTER_ARGS[@]}"
          code=$?
          set -e
          # 1 is the soft findings signal; anything else is a failed join.
          case "$code" in 0|1) ;; *) exit "$code" ;; esac
          node .github/scripts/rtl-report-completion.mjs \
            --report rtl-audit-report.json \
            --package core \
            --filter "$FILTER"

      - name: Write scorecard summary
        if: always() && hashFiles('rtl-audit-report.json') != ''
        run: |
          node .github/scripts/rtl-scorecard-summary.mjs \
            --report rtl-audit-report.json \
            --scope "${{ steps.join.outputs.components }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload RTL shard evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rtl-audit-report-core
          path: |
            rtl-shard-scope.json
            rtl-audit-report.json
          if-no-files-found: error
          retention-days: 1

  # Stable required context joining the five package shards above.
  pr-rtl:
    needs: [check-scope, check-components, pr-rtl-shard, pr-rtl-merge]
    if: ${{ always() && !cancelled() && ((github.event_name == 'pull_request' && needs.check-scope.outputs.spec_only != 'true') || (github.event_name == 'workflow_dispatch' && inputs.operation == 'release-check')) }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Download applicable RTL shard reports
        if: ${{ needs.check-components.result == 'success' && (needs.check-components.outputs.has_rtl_components == 'true' || needs.check-components.outputs.has_rtl_harness == 'true' || needs.check-components.outputs.force_full_component_audits == 'true') }}
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: rtl-audit-report-*
          path: rtl-shard-reports

      - name: Require every applicable RTL shard
        if: always()
        run: |
          node .github/scripts/rtl-join.mjs \
            --check-components "${{ needs.check-components.result }}" \
            --shards "${{ needs.pr-rtl-shard.result == needs.pr-rtl-merge.result && needs.pr-rtl-shard.result || format('{0}/{1}', needs.pr-rtl-shard.result, needs.pr-rtl-merge.result) }}" \
            --should-run "${{ needs.check-components.outputs.has_rtl_components == 'true' || needs.check-components.outputs.has_rtl_harness == 'true' || needs.check-components.outputs.force_full_component_audits == 'true' }}" \
            --force-full "${{ needs.check-components.outputs.force_full_component_audits }}" \
            --reports-dir rtl-shard-reports

  # Release-time projection only: the existing owners above do all measurement.
  # A skipped owner or main drift must never look like passing release evidence.
  release-check:
    needs:
      [
        check-scope,
        check-components,
        build-storybook,
        typecheck,
        pr-visual,
        pr-a11y,
        a11y-contracts,
        pr-a11y-audit,
        pr-rtl,
      ]
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.operation == 'release-check' }}
    runs-on: ubuntu-slim
    permissions:
      contents: read
    steps:
      - name: Require complete exact-head canonical checks
        uses: actions/github-script@v9
        env:
          RELEASE_NEEDS: ${{ toJSON(needs) }}
          RELEASE_BRANCH: ${{ inputs['release-branch'] }}
          EXPECTED_HEAD: ${{ inputs['expected-head'] }}
          CHECKED_HEAD: ${{ needs.check-scope.outputs.release_head }}
          PLAN_DIGEST: ${{ needs.check-scope.outputs.release_plan_digest }}
        with:
          script: |
            const needs = JSON.parse(process.env.RELEASE_NEEDS);
            for (const name of ['check-scope', 'check-components', 'build-storybook', 'typecheck', 'pr-visual', 'pr-a11y', 'a11y-contracts', 'pr-a11y-audit', 'pr-rtl']) {
              if (needs[name]?.result !== 'success') {
                throw new Error(`Required release job ${name} did not succeed: ${needs[name]?.result}`);
              }
            }
            const branch = process.env.RELEASE_BRANCH;
            const expectedHead = process.env.EXPECTED_HEAD;
            if (context.ref !== `refs/heads/${branch}`) {
              throw new Error('Canonical release checks must run from the requested branch.');
            }
            if (context.sha !== expectedHead) {
              throw new Error('Checked-out commit does not match expected head.');
            }
            const {data} = await github.rest.git.getRef({...context.repo, ref: `heads/${branch}`});
            if (branch === 'main') {
              if (process.env.CHECKED_HEAD !== expectedHead) {
                throw new Error('Main authority check did not bind the expected head.');
              }
              const comparison = await github.rest.repos.compareCommitsWithBasehead({
                ...context.repo,
                basehead: `${expectedHead}...${data.object.sha}`,
              });
              if (!['identical', 'ahead'].includes(comparison.data.status)) {
                throw new Error('Checked main commit is not an ancestor of current main.');
              }
              await core.summary
                .addHeading('Main pre-cut checks complete')
                .addRaw(`Exact head: ${expectedHead}\n\n`)
                .addRaw('Canonical visual, accessibility, and RTL checks completed with full scope. This exact checked commit may be used as the cut SHA while it remains in current main history; later main commits are next-release input.')
                .write();
              return;
            }
            if (data.object.sha !== expectedHead) {
              throw new Error(`${branch} moved during checks; dispatch release-check again for its new head.`);
            }
            if (!branch.startsWith('release/v')) {
              throw new Error('Post-bump release checks require a marked release branch.');
            }
            if (!/^[0-9a-f]{64}$/.test(process.env.PLAN_DIGEST)) {
              throw new Error('Post-bump release checks require the active plan digest.');
            }
            await core.summary
              .addHeading('Release checks complete')
              .addRaw(`Branch: ${branch}\n\n`)
              .addRaw(`Exact head: ${expectedHead}\n\n`)
              .addRaw(`Plan digest: ${process.env.PLAN_DIGEST}\n\n`)
              .addRaw('Canonical visual, accessibility, and RTL checks completed with full scope. Main movement is not release input. This receipt is reusable only for this exact branch, head, and plan digest; any branch revision requires a new run.')
              .write();
