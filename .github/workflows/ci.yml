# CI PROBE: throwaway branch, never merged. It replaces this branch's CI
# workflow so that no job reports under build, test or docsite-test, and posts
# those names as commit statuses with GITHUB_TOKEN instead. It answers one
# question: does such a status count for the required contexts bound to the
# GitHub Actions app? The pull request is closed and the branch deleted after.
name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      state:
        description: The state to post for build, test and docsite-test
        type: choice
        options: [pending, success]
        default: success
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - name: Post the probe statuses
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          STATE: ${{ inputs.state || 'pending' }}
        run: |
          for context in build test docsite-test; do
            gh api "repos/$REPO/statuses/$SHA" -f state="$STATE" -f context="$context" -f description="CI probe: $STATE" >/dev/null
            echo "posted $context=$STATE on $SHA"
          done
