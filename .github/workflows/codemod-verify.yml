# Codemod verification — ensures codemods can reproduce callsite changes
#
# When a PR adds/modifies codemods AND touches consumer code (apps/, stories),
# this workflow:
# 1. Reverts the consumer code changes to the base branch state
# 2. Runs the codemods from source against that reverted code
# 3. Verifies the codemod output matches the PR's committed changes
#
# This enforces the rule: "never manually update callsites — always use the codemod"
# If the codemod can't reproduce the changes, either the codemod is incomplete
# or callsites were hand-edited.
name: Codemod Verify

on:
  pull_request:
    # labeled/unlabeled: a maintainer's allow-manual-edit label re-runs the
    # check; the job skips every other label event.
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
    branches: ["main"]
    paths:
      - "packages/cli/assets/codemods/**"

permissions: {}

concurrency:
  # Another label's event gets a group of its own, so the run it starts (whose
  # job skips) never cancels a check in progress.
  group: "codemod-verify-${{ github.event.pull_request.number }}${{ (github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'allow-manual-edit' && format('-other-label-{0}', github.run_id) || '' }}"
  cancel-in-progress: true

jobs:
  verify-codemods:
    if: ((github.event.action != 'labeled' && github.event.action != 'unlabeled') || github.event.label.name == 'allow-manual-edit') && (github.event_name != 'pull_request' || !github.event.pull_request.draft && (github.event.pull_request.head.repo.full_name == github.repository || contains(github.event.pull_request.labels.*.name, 'ci:run')))
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout PR
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Verify codemod reproduces callsite changes
        id: verify
        env:
          # An owner exception: a maintainer applies the label (triage rights).
          ALLOW_MANUAL_EDIT: ${{ contains(github.event.pull_request.labels.*.name, 'allow-manual-edit') }}
        run: node .github/scripts/codemod-verify.mjs
