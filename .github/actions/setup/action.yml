name: 'Setup Node and pnpm'
description: >-
  Install pnpm, set up Node from .nvmrc, and optionally install workspace
  dependencies from the registry (no Actions cache). Requires actions/checkout
  to have run first — .nvmrc and the composite action itself are read from the
  checked-out tree.

inputs:
  install:
    description: 'Run `pnpm install --frozen-lockfile` after Node is set up.'
    required: false
    default: 'true'
  registry-url:
    description: >-
      npm registry to authenticate against. Publishing jobs set this so
      setup-node writes the auth config npm publish needs.
    required: false
    default: ''

runs:
  using: composite
  steps:
    # The pnpm version comes from package.json's `packageManager` field —
    # never pin it here as well.
    #
    # SHA-pinned like the repo's other third-party actions (crowdin,
    # peter-evans): this composite also runs inside the npm publish jobs, so a
    # mutable tag would let a retagged release into that context. Bump by
    # updating the SHA to the new tag's commit.
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    # .nvmrc is the single source of truth for the Node version, shared with
    # local nvm / fnm / mise. The 24.x line also bundles npm >= 11.5.1, which
    # release.yml requires for OIDC trusted publishing.
    #
    # No dependency cache. The pnpm store is ~245 MB and nearly every job
    # restored it, so one pull request run pulled several GB from the Actions
    # cache and hit its egress limit; a refused or throttled restore then
    # stalled setup for up to ten minutes. A cold `pnpm install` from the
    # registry takes about 13 s, so the cache saved little even when it worked.
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        package-manager-cache: false
        registry-url: ${{ inputs.registry-url }}

    - if: inputs.install == 'true'
      run: pnpm install --frozen-lockfile
      shell: bash
