# Decides, inside the job that owns the work, whether a pull request changes
# anything in that job's scope (spec:AST-030). There is no separate scope job:
# each `test-<scope>` job runs this step right after its checkout and skips
# its remaining steps, reporting success, when nothing in scope changed.
#
# - The PR's own change comes from GitHub's file list for the pull request
#   (its diff from the merge base), never from main's history since an old
#   base, so a long-lived branch does not inherit main's changes (#8812) and
#   no history is fetched or deepened (#8826).
# - The classifier (change-scope.cjs and its two helpers) is read from the PR's
#   base commit, so a pull request cannot loosen its own classification.
# - Anything this step cannot decide (not a pull request, a missing trusted
#   classifier, an API error, an empty file list or one GitHub truncates)
#   puts everything in scope (spec:AST-030 FR3, FR4). A classifier that rejects the change (a spec-only PR with a
#   Changeset) fails the step, as the old scope job failed its dependents.
# - A release-branch pull request is the generated version bump: spec-only and
#   tooling-only, with `release_bump` true.
# - A push that only merges the base branch carries the last run forward
#   (spec:AST-030 FR18): when this workflow's run on the push's previous head
#   passed, and the pull request's own diff (each file's status, names, blob
#   and patch against the merge base) is byte-identical at both heads, `carried` is true, `applies` is false, and the step leaves a
#   notice naming that run. Only a merge-commit head is compared, so a push of
#   ordinary commits makes no REST call. A job that opts in with `carry-forward` skips its
#   work and reports success. A
#   re-run (the pre-merge restart), any other event, and anything this step
#   cannot compare run the job normally.
#
# The job must be checked out first: this is a local action.

name: Test scope
description: Whether this pull request changes anything in the calling job's scope.

inputs:
  paths:
    description: >-
      Optional regular expression over changed file paths (old and new names
      of a rename). When given, `touches` says whether any changed path
      matches; when empty, `touches` is true.
    required: false
    default: ''
  outside-pull-request:
    description: >-
      `applies` outside a pull request (a merge-queue entry): `run` (the
      default) or `skip`, for evidence that already ran on the pull request.
    required: false
    default: run
  component-audit:
    description: >-
      `true` to also classify which component audits apply (the trusted
      component-audit-scope.cjs from the base) and to list the changed files,
      for the visual and RTL jobs.
    required: false
    default: 'false'
  carry-forward:
    description: >-
      `true` for a job whose steps honour `carried`: on a push that only merges
      the base branch, look for a passing earlier run to carry forward. The
      job needs `actions: read`.
    required: false
    default: 'false'
  requires-head-file:
    description: >-
      Optional path the work needs at the PR head. A head cut before that file
      existed, whose diff does not touch it, does not apply (with a notice).
    required: false
    default: ''

outputs:
  spec_only:
    description: The PR changes only spec records.
    value: ${{ steps.scope.outputs.spec_only }}
  docsite_only:
    description: The PR changes only the docsite.
    value: ${{ steps.scope.outputs.docsite_only }}
  tooling_only:
    description: The PR changes only Node tooling.
    value: ${{ steps.scope.outputs.tooling_only }}
  full_suite:
    description: The import graph cannot scope this change; run every test.
    value: ${{ steps.scope.outputs.full_suite }}
  release_bump:
    description: The PR targets a release branch (the generated version bump).
    value: ${{ steps.scope.outputs.release_bump }}
  decided:
    description: >-
      `false` when the step fell back to everything in scope because it could
      not decide; a job that must do work on a lane it cannot recognize (spec
      validation) reads this.
    value: ${{ steps.scope.outputs.decided }}
  touches:
    description: A changed path matches `paths` (true when `paths` is empty or undecidable).
    value: ${{ steps.scope.outputs.touches }}
  has_components:
    description: A component audit applies (with `component-audit`).
    value: ${{ steps.scope.outputs.has_components }}
  has_rtl_components:
    description: An RTL-audited component changed (with `component-audit`).
    value: ${{ steps.scope.outputs.has_rtl_components }}
  has_rtl_harness:
    description: The RTL harness changed (with `component-audit`).
    value: ${{ steps.scope.outputs.has_rtl_harness }}
  force_full_component_audits:
    description: Component audits must run in full (with `component-audit`).
    value: ${{ steps.scope.outputs.force_full_component_audits }}
  changed_files_path:
    description: >-
      A file listing the PR's changed paths, one per line (with
      `component-audit`); empty when the step could not list them.
    value: ${{ steps.scope.outputs.changed_files_path }}
  applies:
    description: >-
      The job's work applies: not a specialized lane (spec, docsite or tooling
      only), `touches` holds, any `requires-head-file` is present, and the
      result is not carried forward.
    value: ${{ steps.scope.outputs.applies }}
  carried:
    description: >-
      `true` when this push only merges the base branch and the previous run,
      on the same pull-request diff, passed: the job carries that result
      forward instead of running its work.
    value: ${{ steps.scope.outputs.carried }}
  carried_from:
    description: >-
      The run a carried result comes from, as "run <id> at <sha>"; empty
      otherwise.
    value: ${{ steps.scope.outputs.carried_from }}

runs:
  using: composite
  steps:
    - id: scope
      uses: actions/github-script@v9
      env:
        SCOPE_PATHS: ${{ inputs.paths }}
        SCOPE_OUTSIDE_PR: ${{ inputs.outside-pull-request }}
        SCOPE_HEAD_FILE: ${{ inputs.requires-head-file }}
        SCOPE_COMPONENT_AUDIT: ${{ inputs.component-audit }}
        SCOPE_CARRY_FORWARD: ${{ inputs.carry-forward }}
      with:
        retries: 3
        script: |
          const fs = require('node:fs');
          const os = require('node:os');
          const path = require('node:path');
          const {execFileSync} = require('node:child_process');

          const everything = {
            spec_only: 'false',
            docsite_only: 'false',
            tooling_only: 'false',
            full_suite: 'true',
            release_bump: 'false',
            touches: 'true',
            applies: 'true',
            decided: 'true',
            carried: 'false',
            carried_from: '',
          };
          // Outside a pull request, or when undecidable, every component audit
          // applies in full; a specialized lane has none.
          const auditAll = {
            has_components: 'true',
            has_rtl_components: 'true',
            has_rtl_harness: 'true',
            force_full_component_audits: 'true',
          };
          const auditNone = {
            has_components: 'false',
            has_rtl_components: 'false',
            has_rtl_harness: 'false',
            force_full_component_audits: 'false',
          };
          const audit = process.env.SCOPE_COMPONENT_AUDIT === 'true';
          Object.assign(everything, audit ? auditAll : {});
          const report = values => {
            for (const [key, value] of Object.entries(values)) core.setOutput(key, value);
            core.info(Object.entries(values).map(([k, v]) => `${k}=${v}`).join(' '));
          };

          if (context.eventName !== 'pull_request') {
            core.info(`${context.eventName}: not a pull request, so everything is in scope.`);
            report({...everything, applies: process.env.SCOPE_OUTSIDE_PR === 'skip' ? 'false' : 'true'});
            return;
          }
          const pr = context.payload.pull_request;
          if (pr.base.ref.startsWith('release/v')) {
            core.info('Release-branch pull request: the generated version bump.');
            report({
              ...everything,
              ...(audit ? auditNone : {}),
              spec_only: 'true',
              tooling_only: 'true',
              release_bump: 'true',
              touches: 'false',
              applies: 'false',
            });
            return;
          }

          let files;
          let root;
          try {
            files = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo,
              pull_number: pr.number,
              per_page: 100,
            });
            // GitHub lists at most 3000 files for a pull request.
            if (files.length >= 3000) throw new Error('GitHub truncated the file list at 3000');
            if (files.length === 0) throw new Error('GitHub listed no changed files');
            root = fs.mkdtempSync(path.join(os.tmpdir(), 'test-scope-'));
            for (const file of [
              '.github/scripts/change-scope.cjs',
              '.github/scripts/knowledge-paths.cjs',
              'scripts/component-packages.cjs',
              ...(audit ? ['.github/scripts/component-audit-scope.cjs'] : []),
            ]) {
              const {data} = await github.rest.repos.getContent({...context.repo, path: file, ref: pr.base.sha});
              fs.mkdirSync(path.join(root, path.dirname(file)), {recursive: true});
              fs.writeFileSync(path.join(root, file), Buffer.from(data.content, 'base64'));
            }
          } catch (error) {
            core.warning(`Scope could not be decided (${error.message}); everything is in scope.`);
            report({...everything, decided: 'false'});
            return;
          }

          const STATUS = {added: 'A', removed: 'D', modified: 'M', changed: 'M', copied: 'C', unchanged: 'M'};
          const nameStatus = files
            .map(f => f.status === 'renamed'
              ? `R100\t${f.previous_filename}\t${f.filename}`
              : `${STATUS[f.status] ?? 'M'}\t${f.filename}`)
            .join('\n');
          const outputFile = path.join(root, 'classification');
          fs.writeFileSync(outputFile, '');
          try {
            execFileSync('node', [path.join(root, '.github/scripts/change-scope.cjs'), '--github-output'], {
              input: `${nameStatus}\n`,
              env: {...process.env, GITHUB_OUTPUT: outputFile},
              stdio: ['pipe', 'inherit', 'inherit'],
            });
          } catch (error) {
            core.setFailed(`The trusted classifier rejected this change: ${error.message}`);
            return;
          }
          const classified = Object.fromEntries(
            fs.readFileSync(outputFile, 'utf8').split('\n').filter(Boolean).map(line => line.split('=')),
          );

          let touches = 'true';
          if (process.env.SCOPE_PATHS) {
            const pattern = new RegExp(process.env.SCOPE_PATHS);
            touches = String(files.some(f => pattern.test(f.filename) || (f.previous_filename != null && pattern.test(f.previous_filename))));
          }
          const specialized = ['spec_only', 'docsite_only', 'tooling_only'].some(key => classified[key] === 'true');
          let applies = String(!specialized && touches === 'true');
          const headFile = process.env.SCOPE_HEAD_FILE;
          if (applies === 'true' && headFile && !files.some(f => f.filename === headFile || f.previous_filename === headFile)) {
            try {
              await github.rest.repos.getContent({...context.repo, path: headFile, ref: pr.head.sha});
            } catch (error) {
              if (error.status === 404) {
                core.notice(`This pull request's head has no ${headFile}; merge main to run this check.`);
                applies = 'false';
              }
            }
          }
          let componentScope = {};
          if (audit) {
            if (specialized) {
              componentScope = auditNone;
            } else {
              const auditFile = path.join(root, 'component-audit');
              fs.writeFileSync(auditFile, '');
              try {
                execFileSync('node', [
                  path.join(root, '.github/scripts/component-audit-scope.cjs'),
                  '--registry',
                  path.join(root, 'scripts/component-packages.cjs'),
                  '--github-output',
                ], {input: `${nameStatus}\n`, env: {...process.env, GITHUB_OUTPUT: auditFile}, stdio: ['pipe', 'inherit', 'inherit']});
                componentScope = Object.fromEntries(
                  fs.readFileSync(auditFile, 'utf8').split('\n').filter(Boolean).map(line => line.split('=')),
                );
              } catch (error) {
                core.warning(`Component audit scope could not be decided (${error.message}); every audit runs in full.`);
                componentScope = auditAll;
              }
            }
            // A file, not an output value: a large pull request's list would
            // not fit an environment variable.
            const changedFilesPath = path.join(process.env.RUNNER_TEMP || os.tmpdir(), 'test-scope-changed-files.txt');
            const changed = [...new Set(files.flatMap(f => [f.filename, f.previous_filename].filter(Boolean)))];
            fs.writeFileSync(changedFilesPath, `${changed.join('\n')}\n`);
            componentScope.changed_files_path = changedFilesPath;
          }
          // The run that passed on this push's previous head, when the pull
          // request's own diff is byte-identical at both heads: the push only
          // merged the base branch (spec:AST-030 FR18). Only a first attempt
          // of a push carries; the pre-merge re-run, an opened, reopened or
          // ready pull request, and anything that cannot be compared run the
          // job.
          async function carriedRun() {
            if (process.env.SCOPE_CARRY_FORWARD !== 'true') return null;
            const before = context.payload.before;
            if (context.payload.action !== 'synchronize' || !before) return null;
            if (Number(process.env.GITHUB_RUN_ATTEMPT ?? '1') !== 1) return null;
            const workflow = /\/\.github\/workflows\/([^/@]+)@/.exec(process.env.GITHUB_WORKFLOW_REF ?? '')?.[1];
            if (workflow == null) return null;
            // Only a merge commit can merge the base branch. GraphQL has its own
            // budget, so a push of ordinary commits spends no REST call.
            const {repository} = await github.graphql(
              'query($owner: String!, $repo: String!, $oid: GitObjectID!) { repository(owner: $owner, name: $repo) { object(oid: $oid) { ... on Commit { parents { totalCount } } } } }',
              {...context.repo, oid: pr.head.sha},
            );
            if ((repository?.object?.parents?.totalCount ?? 0) < 2) return null;
            // The pull request's own diff: each file's status, names, blob and
            // patch against its merge base with the base branch. This head's
            // is the file list above; the previous head's comes from a
            // comparison, which GitHub lists the same way. GitHub lists at
            // most 300 files in a comparison.
            const ownDiff = list => JSON.stringify(list
              .map(f => [f.filename, f.previous_filename ?? '', f.status, f.sha ?? '', f.patch ?? ''])
              .sort((a, b) => (a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0)));
            if (files.length >= 300) return null;
            const {data: comparison} = await github.rest.repos.compareCommitsWithBasehead({
              ...context.repo, basehead: `${pr.base.sha}...${before}`,
            });
            const earlier = comparison.files ?? [];
            if (earlier.length === 0 || earlier.length >= 300) return null;
            if (ownDiff(earlier) !== ownDiff(files)) return null;
            // This workflow's last completed run on the previous head, from
            // this pull request's repository and branch. A run's list of pull
            // requests is not kept (a fork's is always empty), so the branch
            // identifies it.
            const {data} = await github.rest.actions.listWorkflowRuns({
              ...context.repo, workflow_id: workflow, event: 'pull_request', head_sha: before, per_page: 10,
            });
            const ours = run =>
              run.head_repository?.full_name === pr.head.repo.full_name && run.head_branch === pr.head.ref;
            const last = data.workflow_runs.find(run =>
              ours(run) && run.status === 'completed' && !['cancelled', 'skipped'].includes(run.conclusion));
            return last?.conclusion === 'success' ? last : null;
          }
          let carried = {carried: 'false', carried_from: ''};
          try {
            const last = await carriedRun();
            if (last != null) {
              const from = `run ${last.id} at ${last.head_sha}`;
              carried = {carried: 'true', carried_from: from, applies: 'false'};
              const message = `Carried forward from ${from} (${last.html_url}): this push only merges ${pr.base.ref}, and the pull request's own diff is unchanged. The pre-merge re-run runs everything.`;
              core.notice(message, {title: 'Result carried forward'});
              await core.summary?.addRaw(`${message}\n`).write();
            }
          } catch (error) {
            core.warning(`Could not compare with the last run (${error.message}); running this job.`);
          }
          report({...everything, ...classified, ...componentScope, release_bump: 'false', touches, applies, ...carried});
