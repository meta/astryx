# Decides, inside the job that owns the work, whether a pull request changes
# anything in that job's scope (spec:AST-030). There is no separate scope job:
# each `test-<scope>` job runs this step right after its checkout and skips
# its remaining steps, reporting success, when nothing in scope changed.
#
# - The PR's own change comes from GitHub's file list for the pull request
#   (its diff from the merge base), never from main's history since an old
#   base, so a long-lived branch does not inherit main's changes (#8812) and
#   no history is fetched or deepened (#8826).
# - The classifier (change-scope.cjs and its two helpers) is read from the PR's
#   base commit, so a pull request cannot loosen its own classification. It is
#   read in one GraphQL query, not a REST call per file: every job runs this
#   step, and every workflow shares the repository's REST rate limit.
# - Anything this step cannot decide (not a pull request, a missing trusted
#   classifier, an API error, an empty file list or one GitHub truncates)
#   puts everything in scope (spec:AST-030 FR3, FR4). A classifier that rejects the change (a spec-only PR with a
#   Changeset) fails the step, as the old scope job failed its dependents.
# - A release-branch generated bump keeps its narrow lane. Any other candidate
#   runs every test lane; the trusted release validator then admits only the
#   proven test-repair class and rejects every broader change.
#
# The job must be checked out first: this is a local action.

name: Test scope
description: Whether this pull request changes anything in the calling job's scope.

inputs:
  paths:
    description: >-
      Optional regular expression over changed file paths (old and new names
      of a rename). When given, `touches` says whether any changed path
      matches; when empty, `touches` is true.
    required: false
    default: ''
  outside-pull-request:
    description: >-
      `applies` outside a pull request (a merge-queue entry): `run` (the
      default) or `skip`, for evidence that already ran on the pull request.
    required: false
    default: run
  component-audit:
    description: >-
      `true` to also classify which component audits apply (the trusted
      component-audit-scope.cjs from the base) and to list the changed files,
      for the visual and RTL jobs.
    required: false
    default: 'false'
  requires-head-file:
    description: >-
      Optional path the work needs at the PR head. A head cut before that file
      existed, whose diff does not touch it, does not apply (with a notice),
      and `head_file_present` says so whether or not `touches` holds.
    required: false
    default: ''
  lab-only-specs:
    description: >-
      Optional pattern over changed paths. On a Lab-only change, a changed file
      that matches it is still this job's work: `applies` holds, and
      `lab_specs_path` lists those files, so the job runs only them.
    required: false
    default: ''

outputs:
  spec_only:
    description: The PR changes only spec records.
    value: ${{ steps.scope.outputs.spec_only }}
  docsite_only:
    description: The PR changes only the docsite.
    value: ${{ steps.scope.outputs.docsite_only }}
  tooling_only:
    description: The PR changes only Node tooling.
    value: ${{ steps.scope.outputs.tooling_only }}
  lab_only:
    description: >-
      The PR changes only the Lab package (and Changesets): it runs the Lab
      tests and the Storybook build, nothing else (spec:AST-030 FR26).
    value: ${{ steps.scope.outputs.lab_only }}
  full_suite:
    description: The import graph cannot scope this change; run every test.
    value: ${{ steps.scope.outputs.full_suite }}
  vitest_full_suite:
    description: >-
      The Vitest lanes run every test. `false` also for shared infrastructure
      only Vitest's module graph reaches (spec:AST-030 FR13); a base whose
      classifier predates it reports nothing, which runs every test.
    value: ${{ steps.scope.outputs.vitest_full_suite }}
  release_bump:
    description: The PR targets a release branch and must pass release validation.
    value: ${{ steps.scope.outputs.release_bump }}
  decided:
    description: >-
      `false` when the step fell back to everything in scope because it could
      not decide; a job that must do work on a lane it cannot recognize (spec
      validation) reads this.
    value: ${{ steps.scope.outputs.decided }}
  truncated:
    description: >-
      `true` when the step could not decide because GitHub truncated the pull
      request's file list (3,000 files); a re-run cannot decide such a scope.
    value: ${{ steps.scope.outputs.truncated }}
  touches:
    description: A changed path matches `paths` (true when `paths` is empty or undecidable).
    value: ${{ steps.scope.outputs.touches }}
  has_components:
    description: A component audit applies (with `component-audit`).
    value: ${{ steps.scope.outputs.has_components }}
  has_rtl_components:
    description: An RTL-audited component changed (with `component-audit`).
    value: ${{ steps.scope.outputs.has_rtl_components }}
  has_rtl_harness:
    description: The RTL harness changed (with `component-audit`).
    value: ${{ steps.scope.outputs.has_rtl_harness }}
  force_full_component_audits:
    description: Component audits must run in full (with `component-audit`).
    value: ${{ steps.scope.outputs.force_full_component_audits }}
  changed_files_path:
    description: >-
      A file listing the PR's changed paths, one per line (with
      `component-audit`); empty when the step could not list them.
    value: ${{ steps.scope.outputs.changed_files_path }}
  head_file_present:
    description: >-
      `false` when the PR head lacks `requires-head-file` and its diff does not
      touch it (a head cut before the file existed); `true` otherwise.
    value: ${{ steps.scope.outputs.head_file_present }}
  lab_specs_path:
    description: >-
      With `lab-only-specs`: on a Lab-only change, a file listing the changed
      files that match it, one per line; empty otherwise.
    value: ${{ steps.scope.outputs.lab_specs_path }}
  applies:
    description: >-
      The job's work applies: not a specialized lane (spec, docsite, tooling or
      Lab only), `touches` holds, and any `requires-head-file` is present. On a
      Lab-only change it also holds when `lab_specs_path` lists a file.
    value: ${{ steps.scope.outputs.applies }}

runs:
  using: composite
  steps:
    - id: scope
      uses: actions/github-script@v9
      env:
        SCOPE_PATHS: ${{ inputs.paths }}
        SCOPE_OUTSIDE_PR: ${{ inputs.outside-pull-request }}
        SCOPE_HEAD_FILE: ${{ inputs.requires-head-file }}
        SCOPE_COMPONENT_AUDIT: ${{ inputs.component-audit }}
        SCOPE_LAB_ONLY_SPECS: ${{ inputs.lab-only-specs }}
      with:
        retries: 3
        script: |
          const fs = require('node:fs');
          const os = require('node:os');
          const path = require('node:path');
          const {execFileSync} = require('node:child_process');

          const everything = {
            spec_only: 'false',
            docsite_only: 'false',
            tooling_only: 'false',
            lab_only: 'false',
            full_suite: 'true',
            vitest_full_suite: 'true',
            release_bump: 'false',
            touches: 'true',
            applies: 'true',
            head_file_present: 'true',
            decided: 'true',
            truncated: 'false',
            lab_specs_path: '',
          };
          // Outside a pull request, or when undecidable, every component audit
          // applies in full; a specialized lane has none.
          const auditAll = {
            has_components: 'true',
            has_rtl_components: 'true',
            has_rtl_harness: 'true',
            force_full_component_audits: 'true',
          };
          const auditNone = {
            has_components: 'false',
            has_rtl_components: 'false',
            has_rtl_harness: 'false',
            force_full_component_audits: 'false',
          };
          const audit = process.env.SCOPE_COMPONENT_AUDIT === 'true';
          Object.assign(everything, audit ? auditAll : {});
          const report = values => {
            for (const [key, value] of Object.entries(values)) core.setOutput(key, value);
            core.info(Object.entries(values).map(([k, v]) => `${k}=${v}`).join(' '));
          };
          const writeChangedFiles = files => {
            const changedFilesPath = path.join(
              process.env.RUNNER_TEMP || os.tmpdir(),
              'test-scope-changed-files.txt',
            );
            const changed = [
              ...new Set(
                files.flatMap(file =>
                  [file.filename, file.previous_filename].filter(Boolean),
                ),
              ),
            ];
            fs.writeFileSync(changedFilesPath, `${changed.join('\n')}\n`);
            return changedFilesPath;
          };

          if (context.eventName !== 'pull_request') {
            core.info(`${context.eventName}: not a pull request, so everything is in scope.`);
            report({...everything, applies: process.env.SCOPE_OUTSIDE_PR === 'skip' ? 'false' : 'true'});
            return;
          }
          const pr = context.payload.pull_request;
          let files;
          let root;
          // The base's policy files are copied to a temporary folder that
          // lives only while this step decides the scope.
          try {
            try {
              files = await github.paginate(github.rest.pulls.listFiles, {
                ...context.repo,
                pull_number: pr.number,
                per_page: 100,
              });
              // GitHub lists at most 3000 files for a pull request.
              if (files.length >= 3000) throw new Error('GitHub truncated the file list at 3000');
              if (files.length === 0) throw new Error('GitHub listed no changed files');
              root = fs.mkdtempSync(path.join(os.tmpdir(), 'test-scope-'));
              // The trusted policy comes from the base commit in one GraphQL
              // query: every job in every run reads it, and one REST call per
              // file counted against the repository's shared REST rate limit.
              const policy = [
                '.github/scripts/change-scope.cjs',
                '.github/scripts/knowledge-paths.cjs',
                'scripts/component-packages.cjs',
                'scripts/release/release-paths.mjs',
                ...(audit ? ['.github/scripts/component-audit-scope.cjs'] : []),
                // Data, not code: the Lab entry check reads the base's copy.
                'packages/cli/assets/discover/official-packages.json',
              ];
              const optionalPolicy = new Set(['packages/cli/assets/discover/official-packages.json']);
              const {repository} = await github.graphql(
                `query($owner: String!, $repo: String!, ${policy.map((_, i) => `$f${i}: String!`).join(', ')}) {
                  repository(owner: $owner, name: $repo) {
                    ${policy.map((_, i) => `f${i}: object(expression: $f${i}) { ... on Blob { text isTruncated } }`).join('\n')}
                  }
                }`,
                {...context.repo, ...Object.fromEntries(policy.map((file, i) => [`f${i}`, `${pr.base.sha}:${file}`]))},
              );
              for (const [i, file] of policy.entries()) {
                const blob = repository?.[`f${i}`];
                // A missing data file only keeps the change out of the Lab-only lane.
                if (optionalPolicy.has(file) && (typeof blob?.text !== 'string' || blob.isTruncated)) continue;
                if (typeof blob?.text !== 'string' || blob.isTruncated) throw new Error(`the base has no readable ${file}`);
                fs.mkdirSync(path.join(root, path.dirname(file)), {recursive: true});
                fs.writeFileSync(path.join(root, file), blob.text);
              }
            } catch (error) {
              core.warning(`Scope could not be decided (${error.message}); everything is in scope.`);
              report({
                ...everything,
                release_bump: String(pr.base.ref.startsWith('release/v')),
                decided: 'false',
                truncated: String(/truncated the file list/.test(error.message)),
              });
              return;
            }

            const STATUS = {added: 'A', removed: 'D', modified: 'M', changed: 'M', copied: 'C', unchanged: 'M'};
            const nameStatus = files
              .map(f => f.status === 'renamed'
                ? `R100\t${f.previous_filename}\t${f.filename}`
                : `${STATUS[f.status] ?? 'M'}\t${f.filename}`)
              .join('\n');

            if (pr.base.ref.startsWith('release/v')) {
              const releaseKind = execFileSync(
                'node',
                [
                  path.join(root, 'scripts/release/release-paths.mjs'),
                  '--classify',
                ],
                {encoding: 'utf8', input: `${nameStatus}\n`},
              ).trim();
              if (releaseKind === 'version-bump') {
                core.info('Release-branch pull request: the generated version bump.');
                report({
                  ...everything,
                  ...(audit ? auditNone : {}),
                  spec_only: 'true',
                  tooling_only: 'true',
                  release_bump: 'true',
                  touches: 'false',
                  applies: 'false',
                });
              } else {
                core.info(
                  `Release-branch ${releaseKind} candidate: every test lane runs; the release validator decides whether the change is allowed.`,
                );
                report({
                  ...everything,
                  ...(audit ? auditAll : {}),
                  release_bump: 'true',
                  changed_files_path: writeChangedFiles(files),
                });
              }
              return;
            }
            const outputFile = path.join(root, 'classification');
            fs.writeFileSync(outputFile, '');
            // GitHub's patch text for the Lab entry files, handed over as data:
            // the classifier reads it and never runs it. GitHub leaves out the
            // patch of a large diff; such a file then keeps full CI.
            const LAB_ENTRY = /^(internal\/shadcn-registry\/routes\.lock\.json|packages\/cli\/assets\/discover\/official-packages\.json|apps\/storybook\/stories\/[A-Z][A-Za-z0-9]*\.stories\.tsx)$/;
            const patchesFile = path.join(root, 'lab-entry-patches.json');
            fs.writeFileSync(patchesFile, JSON.stringify(Object.fromEntries(
              files.filter(f => LAB_ENTRY.test(f.filename)).map(f => [f.filename, typeof f.patch === 'string' ? f.patch : null]),
            )));
            try {
              execFileSync('node', [
                path.join(root, '.github/scripts/change-scope.cjs'),
                '--github-output',
                '--patches', patchesFile,
                '--official-packages-base', path.join(root, 'packages/cli/assets/discover/official-packages.json'),
              ], {
                input: `${nameStatus}\n`,
                env: {...process.env, GITHUB_OUTPUT: outputFile},
                stdio: ['pipe', 'inherit', 'inherit'],
              });
            } catch (error) {
              core.setFailed(`The trusted classifier rejected this change: ${error.message}`);
              return;
            }
            const classified = Object.fromEntries(
              fs.readFileSync(outputFile, 'utf8').split('\n').filter(Boolean).map(line => line.split('=')),
            );

            let touches = 'true';
            if (process.env.SCOPE_PATHS) {
              const pattern = new RegExp(process.env.SCOPE_PATHS);
              touches = String(files.some(f => pattern.test(f.filename) || (f.previous_filename != null && pattern.test(f.previous_filename))));
            }
            // A base whose classifier predates lab_only reports none: false.
            const specialized = ['spec_only', 'docsite_only', 'tooling_only', 'lab_only'].some(key => classified[key] === 'true');
            // A Lab-only change skips Lab source, but a changed file the job
            // names (an interaction spec) still runs, alone.
            const labOnly =
              classified.lab_only === 'true' &&
              !['spec_only', 'docsite_only', 'tooling_only'].some(key => classified[key] === 'true');
            const labSpecs =
              labOnly && process.env.SCOPE_LAB_ONLY_SPECS
                ? files
                    .filter(f => f.status !== 'removed' && new RegExp(process.env.SCOPE_LAB_ONLY_SPECS).test(f.filename))
                    .map(f => f.filename)
                : [];
            let labSpecsPath = '';
            if (labSpecs.length > 0) {
              labSpecsPath = path.join(process.env.RUNNER_TEMP || os.tmpdir(), 'test-scope-lab-specs.txt');
              fs.writeFileSync(labSpecsPath, `${labSpecs.join('\n')}\n`);
            }
            let applies = String((!specialized && touches === 'true') || labSpecs.length > 0);
            // Whether the head has the file the work needs, decided whether or
            // not `touches` holds; a diff that touches the file keeps it.
            let headFilePresent = 'true';
            const headFile = process.env.SCOPE_HEAD_FILE;
            if ((!specialized || labSpecs.length > 0) && headFile && !files.some(f => f.filename === headFile || f.previous_filename === headFile)) {
              try {
                await github.rest.repos.getContent({...context.repo, path: headFile, ref: pr.head.sha});
              } catch (error) {
                if (error.status === 404) {
                  core.notice(`This pull request's head has no ${headFile}, so this job skips what needs it; merging main brings it in.`);
                  headFilePresent = 'false';
                }
              }
            }
            if (headFilePresent === 'false') applies = 'false';
            let componentScope = {};
            if (audit) {
              // A Lab-only change keeps its component audits: the default
              // touched check skips it, but a maintainer's label still runs its
              // suite on Lab's components (spec:AST-030 FR12, FR26).
              if (specialized && classified.lab_only !== 'true') {
                componentScope = auditNone;
              } else {
                const auditFile = path.join(root, 'component-audit');
                fs.writeFileSync(auditFile, '');
                try {
                  execFileSync('node', [
                    path.join(root, '.github/scripts/component-audit-scope.cjs'),
                    '--registry',
                    path.join(root, 'scripts/component-packages.cjs'),
                    '--github-output',
                  ], {input: `${nameStatus}\n`, env: {...process.env, GITHUB_OUTPUT: auditFile}, stdio: ['pipe', 'inherit', 'inherit']});
                  componentScope = Object.fromEntries(
                    fs.readFileSync(auditFile, 'utf8').split('\n').filter(Boolean).map(line => line.split('=')),
                  );
                } catch (error) {
                  core.warning(`Component audit scope could not be decided (${error.message}); every audit runs in full.`);
                  componentScope = auditAll;
                }
              }
              componentScope.changed_files_path = writeChangedFiles(files);
            }
            report({...everything, ...classified, ...componentScope, release_bump: 'false', touches, applies, head_file_present: headFilePresent, lab_specs_path: labSpecsPath});
          } finally {
            if (root) fs.rmSync(root, {recursive: true, force: true});
          }
