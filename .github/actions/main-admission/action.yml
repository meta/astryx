# Holds a `main` full check or release re-check at its start until its jobs fit
# under CI's ceiling (spec:AST-030 FR16, DEC-16). The run's first job runs this
# before its wide legs start, with `peak`, the most jobs the run holds at once.
# While this step runs, pull requests start no new heavy suites (heavy-caps
# reads this step by name), so every pull-request job running now ends within
# the fifteen-minute job budget and the run then fits.
#
# - It starts once other runs' live jobs plus `peak` fit under the ceiling.
# - It looks every two minutes, for at most fifteen minutes, and then starts.
# - A lookup that fails, a rate limit included, starts the run: `main`'s checks
#   are never held by the API.
#
# A step that uses this action MUST be named "Wait for room under the CI
# ceiling"; heavy-caps and its tests read that name.

name: Main admission
description: Waits until a main full check fits under CI's ceiling.

inputs:
  peak:
    description: The most jobs this run holds at once.
    required: true

runs:
  using: composite
  steps:
    - uses: actions/github-script@v9
      env:
        PEAK: ${{ inputs.peak }}
      with:
        retries: 3
        script: |
          // Jobs in progress or queued across all of CI (spec:AST-030 DEC-16).
          const CI_CEILING = 90;
          const LOOK_MS = 2 * 60_000;
          const MAX_WAIT_MS = 15 * 60_000;
          const peak = Number(process.env.PEAK);
          if (!Number.isInteger(peak) || peak < 1) {
            throw new Error(`peak must be a positive integer, got "${process.env.PEAK}".`);
          }
          const started = Date.now();
          let calls = 0;
          try {
            for (;;) {
              // Each look reads each active run's jobs once (one page of 100).
              const seen = new Set();
              let others = 0;
              for (const status of ['in_progress', 'queued']) {
                calls += 1;
                const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
                  ...context.repo, status, per_page: 100,
                });
                for (const run of runs) {
                  if (seen.has(run.id) || run.id === context.runId) continue;
                  seen.add(run.id);
                  calls += 1;
                  const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                    ...context.repo, run_id: run.id, filter: 'latest', per_page: 100,
                  });
                  others += jobs.filter(job => job.status === 'in_progress' || job.status === 'queued').length;
                }
              }
              if (others + peak <= CI_CEILING) {
                core.info(`Room under the CI ceiling: ${others} other jobs + ${peak} <= ${CI_CEILING}.`);
                return;
              }
              if (Date.now() - started + LOOK_MS > MAX_WAIT_MS) {
                core.warning(`CI still holds ${others} other jobs after fifteen minutes; starting.`);
                return;
              }
              core.info(`Waiting for room: ${others} other jobs + ${peak} > ${CI_CEILING}.`);
              await new Promise(resolve => setTimeout(resolve, LOOK_MS));
            }
          } catch (error) {
            core.warning(`Room under the CI ceiling could not be checked (${error.message}); starting.`);
          } finally {
            core.info(`Main admission: ${calls} API calls.`);
          }
