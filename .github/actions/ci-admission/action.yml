# Admits a whole CI run under CI's ceiling of about ninety concurrent jobs
# (spec:AST-030 FR16, DEC-16). GitHub has no repository-wide job limit to set
# (a `concurrency` group serializes runs, it does not count jobs), so each run
# waits for room before its jobs start:
#
# - ci.yml runs it twice. Its first job, `room` (`phase: room`), waits until
#   there is room for one job, the Storybook build, which then starts, and
#   records whether the whole run fit on that look. `admission`
#   (`phase: rest`), which every other ci.yml job needs, waits for the rest of
#   the run unless it already fit. The Main workflow's `main-commit` runs it once
#   (`phase: whole`). A waiting run so holds only its one waiting job, plus a
#   Storybook build that found room. A step that uses this action MUST be named
#   "Wait for room under the CI ceiling": a waiting run is found by that name.
# - A pull-request run that finds no room and ten other pull-request runs
#   already waiting is turned away (`full`): CI is full, and the run stops with
#   that message. `main` runs are never turned away.
# - A run starts once the other active runs' estimated jobs plus `peak` fit
#   under the ceiling. Small workflows that are not admitted (one or two slim
#   jobs a run) always count at least their measured most at once, so the room
#   they can still take is kept free. A pull-request run (`main: false`) also
#   waits while a
#   `main` full check or release re-check is waiting, so `main` fits first;
#   pull-request runs never wait for each other.
# - It waits at most `max-wait-minutes` (fifteen for `main`, twelve for a pull
#   request, inside its fifteen-minute job budget), looking at even intervals
#   plus a random 0-20 s so runs that look together spread out, and then
#   starts.
# - Each CI or Main run counts its live jobs, read once per look. A
#   pull-request run still waiting here counts the jobs it runs, its waiting
#   job and a Storybook build that found room, so waiting runs never hold each
#   other back by more than they use; a waiting
#   `main` run counts its whole peak. A run admitted in the last 45 seconds,
#   before its jobs appear, counts at least its planned most. Every other
#   workflow's run counts an estimate. A run not updated in two hours is a
#   stale record GitHub still lists as active, and counts nothing.
# - A look costs two run listings plus one call per active CI or Main run, and
#   a run looks at most `max-looks` times: twice for a pull request (at once and
#   after its longest wait), every two minutes for the rare `main` run. When the
#   repository's API budget is low, the run starts rather than spend it.
# - A pull request that may not run CI (a draft, or a fork without `ci:run`)
#   starts at once, so its required contexts report their failure (FR17).
# - A failed lookup, a rate limit included, starts the run.

name: CI admission
description: Waits until a CI run's jobs fit under CI's ceiling.

inputs:
  peak:
    description: The most jobs this run holds at once.
    required: true
  main:
    description: "'true' for a main full check or release re-check, which does not wait for other main runs."
    required: true
  max-wait-minutes:
    description: The longest this run waits before it starts anyway.
    required: false
    default: '15'
  max-looks:
    description: The most times this run looks for room.
    required: false
    default: '8'
  label-legs:
    description: JSON map of a pull-request label to the jobs it adds to `peak`.
    required: false
    default: '{}'
  phase:
    description: "'whole' waits for the whole run; 'room' waits for room for one job and records whether the whole run fit; 'rest' waits for the rest of the run after 'room'."
    required: false
    default: whole
  fits:
    description: "For 'rest': 'true' when the whole run fit on the 'room' look."
    required: false
    default: ''
  started:
    description: "For 'rest': when 'room' started, in milliseconds since the epoch."
    required: false
    default: ''
  looks:
    description: "For 'rest': how many looks 'room' made."
    required: false
    default: ''

outputs:
  fits:
    description: "'true' when the whole run fit on the last look."
    value: ${{ steps.wait.outputs.fits }}
  full:
    description: "'true' when CI is full and this pull-request run is turned away."
    value: ${{ steps.wait.outputs.full }}
  started:
    description: When the wait started, in milliseconds since the epoch.
    value: ${{ steps.wait.outputs.started }}
  looks:
    description: How many looks the wait made.
    value: ${{ steps.wait.outputs.looks }}

runs:
  using: composite
  steps:
    - id: wait
      uses: actions/github-script@v9
      env:
        PHASE: ${{ inputs.phase }}
        FITS: ${{ inputs.fits }}
        STARTED: ${{ inputs.started }}
        LOOKS: ${{ inputs.looks }}
        PEAK: ${{ inputs.peak }}
        MAIN: ${{ inputs.main }}
        LABEL_LEGS: ${{ inputs.label-legs }}
        MAX_WAIT_MINUTES: ${{ inputs.max-wait-minutes }}
        MAX_LOOKS: ${{ inputs.max-looks }}
      with:
        retries: 3
        script: |
          const CI_CEILING = 90;
          // Below this many API calls left this hour, a run starts rather than
          // spend the budget every job shares.
          const BUDGET_FLOOR = 1500;
          const JITTER_MS = 20_000;
          const MAX_WAIT_MS = Number(process.env.MAX_WAIT_MINUTES || '15') * 60_000;
          const MAX_LOOKS = Math.max(1, Number(process.env.MAX_LOOKS || '8'));
          const LOOK_MS = MAX_LOOKS > 1 ? (MAX_WAIT_MS - JITTER_MS) / (MAX_LOOKS - 1) : MAX_WAIT_MS;
          const STEP = 'Wait for room under the CI ceiling';
          // At most this many pull-request runs wait at once; one more finding
          // no room is turned away (spec:AST-030 DEC-16).
          const MAX_WAITING = 10;
          const PHASE = process.env.PHASE || 'whole';
          // The most jobs a run holds at once, by workflow: ci.yml's
          // release-check and Main's runs (a push's fast checks or a unit run)
          // from their `peak`
          // (ci-admission.test.mjs), a pull-request ci.yml run from its
          // measured most, every other workflow's run one or two slim jobs.
          const ESTIMATE = {
            '.github/workflows/ci.yml': run => (run.event === 'workflow_dispatch' ? 37 : 16),
            '.github/workflows/deploy.yml': run => (run.event === 'push' ? 4 : 14),
            '.github/workflows/review-signal.yml': () => 2,
          };
          const estimate = run => (ESTIMATE[run.path] ?? (() => 1))(run);
          // The most jobs small, unadmitted workflows ran at once, measured
          // over a busy evening (spec:AST-030 DEC-16).
          const SMALL_MOST = 18;
          const ADMITTED = ['.github/workflows/ci.yml', '.github/workflows/deploy.yml'];
          const admitted = run => ADMITTED.includes(run.path);
          const LIVE = ['in_progress', 'queued', 'waiting', 'pending'];
          // A run's jobs appear within seconds of its admission; until then it
          // counts at its planned most.
          const JUST_ADMITTED_MS = 45_000;
          // GitHub keeps listing some long-finished runs as queued; a run not
          // updated in this long holds no runner.
          const STALE_MS = 2 * 60 * 60_000;
          const short = run => (run.path ?? '').replace(/^.*\//, '').replace(/\.ya?ml$/, '');
          const isMain = run =>
            ['push', 'schedule', 'workflow_dispatch'].includes(run.event) &&
            ['.github/workflows/ci.yml', '.github/workflows/deploy.yml'].includes(run.path);

          let peak = Number(process.env.PEAK);
          if (!Number.isInteger(peak) || peak < 1) {
            throw new Error(`peak must be a positive integer, got "${process.env.PEAK}".`);
          }
          const main = process.env.MAIN === 'true';
          const pr = context.payload.pull_request;
          if (pr != null) {
            const labels = (pr.labels ?? []).map(label => label.name);
            const fork = pr.head?.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}`;
            if (pr.draft || (fork && !labels.includes('ci:run'))) {
              core.info('This pull request runs no CI yet; nothing to admit.');
              return;
            }
            const extra = JSON.parse(process.env.LABEL_LEGS || '{}');
            for (const label of labels) peak += extra[label] ?? 0;
          }

          // 'rest' carries on the wait 'room' began: its clock and its looks.
          const started = PHASE === 'rest' && Number(process.env.STARTED) > 0 ? Number(process.env.STARTED) : Date.now();
          const looked = PHASE === 'rest' ? Math.max(0, Number(process.env.LOOKS) || 0) : 0;
          core.setOutput('started', String(started));
          // The rest waits only when room measured that the run did not fit;
          // when room started on an API error or a low budget, so does the rest.
          if (PHASE === 'rest' && process.env.FITS !== 'false') {
            core.info(process.env.FITS === 'true' ? 'The whole run fit when its first job found room.' : 'Room did not measure the run; starting.');
            return;
          }
          let calls = 0;
          try {
            if (looked > 0) {
              // The next look falls where the wait's schedule puts it.
              const next = started + looked * LOOK_MS - Date.now();
              if (looked >= MAX_LOOKS || next > MAX_WAIT_MS - (Date.now() - started)) {
                core.warning(`Still no room after ${MAX_WAIT_MS / 60_000} minutes; starting.`);
                return;
              }
              if (next > 0) await new Promise(resolve => setTimeout(resolve, next + Math.floor(Math.random() * JITTER_MS)));
            }
            for (let look = looked + 1; ; look += 1) {
              core.setOutput('looks', String(look));
              const seen = new Set();
              let large = 0;
              let small = 0;
              let mainWaiting = false;
              let waitingPulls = 0;
              // What each run counted, logged on every look.
              const counted = [];
              const smallBy = {};
              let stale = 0;
              for (const status of ['in_progress', 'queued']) {
                calls += 1;
                const {data, headers} = await github.rest.actions.listWorkflowRunsForRepo({
                  ...context.repo, status, per_page: 100,
                });
                const left = Number(headers?.['x-ratelimit-remaining']);
                if (Number.isFinite(left) && left < BUDGET_FLOOR) {
                  core.warning(`Only ${left} API calls left this hour; starting without spending them.`);
                  return;
                }
                for (const run of data.workflow_runs) {
                  if (seen.has(run.id) || run.id === context.runId) continue;
                  seen.add(run.id);
                  if (Date.now() - Date.parse(run.updated_at ?? '') > STALE_MS) {
                    stale += 1;
                    continue;
                  }
                  if (!admitted(run)) {
                    small += estimate(run);
                    smallBy[short(run)] = (smallBy[short(run)] ?? 0) + estimate(run);
                    continue;
                  }
                  calls += 1;
                  const {data: {jobs}} = await github.rest.actions.listJobsForWorkflowRun({
                    ...context.repo, run_id: run.id, filter: 'latest', per_page: 100,
                  });
                  // A CI run waits in `room`, then in `admission`.
                  const waits = jobs
                    .flatMap(job => job.steps ?? [])
                    .filter(step => step.name === STEP);
                  if (waits.some(step => step.status === 'in_progress')) {
                    // Still waiting for room. A `main` run holds its whole
                    // peak, ahead of this one. A pull-request run holds what
                    // it runs: the job that waits and its Storybook build,
                    // which starts beside it.
                    const holds = isMain(run) ? estimate(run) : Math.max(1, jobs.filter(job => LIVE.includes(job.status)).length);
                    if (isMain(run) && !main) mainWaiting = true;
                    if (!isMain(run)) waitingPulls += 1;
                    large += holds;
                    counted.push(`${short(run)} ${run.id} ${run.event}: ${holds} waiting`);
                    continue;
                  }
                  const live = jobs.filter(job => LIVE.includes(job.status)).length;
                  const ended = waits.map(step => Date.parse(step.completed_at ?? '')).filter(Number.isFinite);
                  const admittedAt = ended.length > 0 ? Math.max(...ended) : NaN;
                  const fresh = Date.now() - admittedAt < JUST_ADMITTED_MS;
                  const holds = fresh ? Math.max(live, estimate(run)) : live;
                  large += holds;
                  counted.push(`${short(run)} ${run.id} ${run.event}: ${holds}${fresh && holds > live ? ` (admitted just now, ${live} live)` : ' live'}`);
                }
              }
              const others = large + Math.max(small, SMALL_MOST);
              const smallList = Object.entries(smallBy).map(([name, count]) => `${name} ${count}`).join(', ');
              core.info(`Look ${look}: ${counted.join('; ') || 'no CI or Main runs'}. Small workflows ${small}${smallList ? ` (${smallList})` : ''}, counted as ${Math.max(small, SMALL_MOST)}.${stale ? ` Ignored ${stale} stale run${stale === 1 ? '' : 's'}.` : ''}`);
              const fits = others + peak <= CI_CEILING && !mainWaiting;
              core.setOutput('fits', String(fits));
              if (fits) {
                core.info(`Room under the CI ceiling: about ${others} other jobs + ${peak} <= ${CI_CEILING}.`);
                return;
              }
              if (PHASE === 'room') {
                // Pull requests only: merge-queue entries and `main` runs are never turned away.
                if (pr != null && look === 1 && waitingPulls >= MAX_WAITING) {
                  core.setOutput('full', 'true');
                  core.warning(`CI is full: ${waitingPulls} pull-request runs are already waiting and there is no room (about ${others} other jobs + ${peak}).`);
                  return;
                }
                if (others + 1 <= CI_CEILING && !mainWaiting) {
                  core.info(`Room for the Storybook build: about ${others} other jobs + 1 <= ${CI_CEILING}; the rest of the run waits.`);
                  return;
                }
              }
              // The time left decides, not the look's own API time: a slow
              // look still waits the rest of the way for its next one.
              const left = MAX_WAIT_MS - (Date.now() - started);
              const wait = Math.min(LOOK_MS + Math.floor(Math.random() * JITTER_MS), left);
              if (look >= MAX_LOOKS || wait <= 0) {
                core.warning(`Still no room after ${MAX_WAIT_MS / 60_000} minutes (about ${others} other jobs${mainWaiting ? ', a main check waiting' : ''}); starting.`);
                return;
              }
              core.info(`Waiting for room: about ${others} other jobs + ${peak}${mainWaiting ? ', a main check waiting' : ''}.`);
              await new Promise(resolve => setTimeout(resolve, wait));
            }
          } catch (error) {
            core.warning(`Room under the CI ceiling could not be checked (${error.message}); starting.`);
          } finally {
            core.info(`CI admission: ${calls} API calls.`);
          }
