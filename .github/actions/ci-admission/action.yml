# Admits a whole CI run under CI's ceiling of about ninety concurrent jobs
# (spec:AST-030 FR16, DEC-16). GitHub has no repository-wide job limit to set
# (a `concurrency` group serializes runs, it does not count jobs), so each run
# waits for room before its jobs start:
#
# - ci.yml runs it twice. Its first job, `room` (`phase: room`), waits until
#   there is room for one job, the Storybook build, which then starts, and
#   records whether the whole run fit on that look. `admission`
#   (`phase: rest`), which every other ci.yml job needs, waits for the rest of
#   the run unless it already fit. The Main workflow's `main-commit` runs it once
#   (`phase: whole`). A waiting run so holds only its one waiting job, plus a
#   Storybook build that found room. A step that uses this action MUST be named
#   "Wait for room under the CI ceiling": a waiting run is found by that name.
# - A pull-request run that finds no room waits like the others, on its slim
#   runner, until its longest wait. One still without room there is turned
#   away (`full`): CI is full, and the run stops with that message, unless it
#   is the only pull-request run to start there in ten minutes and no run that
#   waited longer still waits. `main` runs are never turned away.
# - A run starts once the other active runs' estimated jobs plus `peak` fit
#   under the ceiling. Small workflows that are not admitted (one or two slim
#   jobs a run) always count at least eighteen jobs, which covers all but their
#   rarest bursts, so the room they can still take is kept free. Waiting
#   `main` runs queue by when they began waiting: to a `main` run, one that
#   began waiting after it counts only its waiting job. A pull-request run (`main: false`) also
#   waits while a
#   `main` full check or release re-check is waiting, for that wait's first
#   fifteen minutes, so `main` fits first; pull-request runs never wait for
#   each other.
# - It waits at most `max-wait-minutes` (120 for `main`, on a standard runner,
#   since a slim job stops at fifteen minutes; twelve for a pull request,
#   inside its fifteen-minute job budget), looking at even intervals
#   plus a random 0-20 s so runs that look together spread out, and then
#   starts (a pull request: see above).
# - Each CI or Main run counts its live jobs, read once per look. A
#   pull-request run still waiting here counts the jobs it runs, its waiting
#   job and a Storybook build that found room, so waiting runs never hold each
#   other back by more than they use; a waiting
#   `main` run counts its whole peak. A run admitted in the last 45 seconds,
#   before its jobs appear, counts at least its planned most. Every other
#   workflow's run counts an estimate. A run not updated in two hours is a
#   stale record GitHub still lists as active, and counts nothing.
# - A look costs two run listings plus one call per active CI or Main run, and
#   a run looks at most `max-looks` times: twice for a pull request (at once and
#   after its longest wait), about every four minutes for the rare `main` run. A
#   pull-request run that would fit but yields to a waiting `main` check looks
#   again every two minutes while it does, and a run within ten jobs of room
#   every four, both outside that count and inside the run's longest wait. When the
#   repository's API budget is low, the run starts rather than spend it.
# - A pull request that may not run CI (a draft, or a fork without `ci:run`)
#   starts at once, so its required contexts report their failure (FR17).
# - A run can hold more matrix legs at once when CI has room for them
#   (`leg-widths`). It waits for `peak`, which counts each such matrix at its
#   tight width. When the look that starts it also has room for every matrix
#   at full width, `widths` gives the full widths, and the matrices'
#   `max-parallel` reads them; on any other start, the tight widths. So the run
#   never starts more legs than the look counted.
# - A failed lookup, a rate limit included, starts the run.

name: CI admission
description: Waits until a CI run's jobs fit under CI's ceiling.

inputs:
  peak:
    description: The most jobs this run holds at once, with each `leg-widths` matrix at its tight width.
    required: true
  main:
    description: "'true' for a main full check or release re-check, which does not wait for other main runs."
    required: true
  max-wait-minutes:
    description: The longest this run waits before it starts anyway.
    required: false
    default: '15'
  max-looks:
    description: The most times this run looks for room.
    required: false
    default: '8'
  label-legs:
    description: JSON map of a pull-request label to the jobs it adds to `peak`.
    required: false
    default: '{}'
  leg-widths:
    description: >-
      JSON map of a matrix job to `{"tight": n, "full": m}`: how many of its
      legs run at once when CI has room for the run at `tight` widths only
      (counted in `peak`), and when it has room at `full` widths. The run
      waits for `peak`; when the deciding look also has room for each job's
      `full - tight` more legs, the legs run at full width (`widths`).
    required: false
    default: '{}'
  wide:
    description: "For 'rest': 'true' when the whole run fit at full leg widths on the 'room' look."
    required: false
    default: ''
  phase:
    description: "'whole' waits for the whole run; 'room' waits for room for one job and records whether the whole run fit; 'rest' waits for the rest of the run after 'room'."
    required: false
    default: whole
  fits:
    description: "For 'rest': 'true' when the whole run fit on the 'room' look."
    required: false
    default: ''
  started:
    description: "For 'rest': when 'room' started, in milliseconds since the epoch."
    required: false
    default: ''
  looks:
    description: "For 'rest': how many of its looks 'room' spent."
    required: false
    default: ''
  next:
    description: "For 'rest': when 'room' planned the next look, in milliseconds since the epoch."
    required: false
    default: ''

outputs:
  fits:
    description: "'true' when the whole run fit on the last look."
    value: ${{ steps.wait.outputs.fits }}
  full:
    description: "'true' when CI is full and this pull-request run is turned away."
    value: ${{ steps.wait.outputs.full }}
  started:
    description: When the wait started, in milliseconds since the epoch.
    value: ${{ steps.wait.outputs.started }}
  looks:
    description: How many of its looks the wait spent.
    value: ${{ steps.wait.outputs.looks }}
  next:
    description: When the wait planned its next look, in milliseconds since the epoch.
    value: ${{ steps.wait.outputs.next }}
  wide:
    description: "'true' when the run starts with room for its legs at full width."
    value: ${{ steps.wait.outputs.wide }}
  widths:
    description: 'JSON map of each `leg-widths` job to how many legs run at once: `full` when `wide`, else `tight`.'
    value: ${{ steps.widths.outputs.widths }}

runs:
  using: composite
  steps:
    - id: wait
      uses: actions/github-script@v9
      env:
        PHASE: ${{ inputs.phase }}
        FITS: ${{ inputs.fits }}
        STARTED: ${{ inputs.started }}
        NEXT: ${{ inputs.next }}
        LOOKS: ${{ inputs.looks }}
        PEAK: ${{ inputs.peak }}
        MAIN: ${{ inputs.main }}
        LABEL_LEGS: ${{ inputs.label-legs }}
        LEG_WIDTHS: ${{ inputs.leg-widths }}
        WIDE: ${{ inputs.wide }}
        MAX_WAIT_MINUTES: ${{ inputs.max-wait-minutes }}
        MAX_LOOKS: ${{ inputs.max-looks }}
        COUNT_MODULE: ${{ github.action_path }}/count.mjs
      with:
        retries: 3
        script: |
          // The count itself is shared with the tools that grant CI capacity,
          // so both read CI the same way (count.mjs).
          const {pathToFileURL} = await import('node:url');
          const {CI_CEILING, STEP, AT_LIMIT_SPACING_MS, waitSpan, countLook} = await import(
            pathToFileURL(process.env.COUNT_MODULE).href
          );
          const JITTER_MS = 20_000;
          const MAX_WAIT_MS = Number(process.env.MAX_WAIT_MINUTES || '15') * 60_000;
          const MAX_LOOKS = Math.max(1, Number(process.env.MAX_LOOKS || '8'));
          const LOOK_MS = MAX_LOOKS > 1 ? (MAX_WAIT_MS - JITTER_MS) / (MAX_LOOKS - 1) : MAX_WAIT_MS;
          // A run that would fit but yields to a waiting `main` check looks
          // again this soon, outside its count of looks: the yield lasts at
          // most MAIN_YIELD_MS.
          const YIELD_LOOK_MS = 2 * 60_000;
          // A run with no room but within this many jobs of it looks again
          // this soon, also outside its count of looks: near-full CI frees
          // that much in minutes. A run further from room keeps its looks.
          const NEAR_JOBS = 10;
          const NEAR_LOOK_MS = 4 * 60_000;
          // After a look without room: whether it spends one of the run's
          // looks, and how soon the next look comes. `over` is how many jobs
          // past the ceiling admitting would go.
          const plan = (over, yieldsToMain) => {
            if (yieldsToMain && over <= 0) return {spends: false, interval: YIELD_LOOK_MS};
            if (over <= NEAR_JOBS) return {spends: false, interval: Math.min(NEAR_LOOK_MS, LOOK_MS)};
            return {spends: true, interval: LOOK_MS};
          };
          // A pull-request run that reaches its longest wait without room
          // starts only if no other pull-request run started at its longest
          // wait in the last ten minutes, about the time one run takes, and
          // no run that has waited longer still waits; otherwise CI is full
          // for it. So runs that waited out the same burst start one at a
          // time, and CI passes ninety by about one run's jobs at most
          // (spec:AST-030 DEC-16).
          const PHASE = process.env.PHASE || 'whole';
          let peak = Number(process.env.PEAK);
          if (!Number.isInteger(peak) || peak < 1) {
            throw new Error(`peak must be a positive integer, got "${process.env.PEAK}".`);
          }
          // The legs run at full width only when the deciding look has room
          // for them; every other start runs them at tight width, which
          // `peak` counts.
          core.setOutput('wide', 'false');
          const widths = Object.values(JSON.parse(process.env.LEG_WIDTHS || '{}'));
          const widen = widths.reduce((sum, width) => sum + width.full - width.tight, 0);
          const main = process.env.MAIN === 'true';
          const pr = context.payload.pull_request;
          if (pr != null) {
            const labels = (pr.labels ?? []).map(label => label.name);
            const fork = pr.head?.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}`;
            if (pr.draft || (fork && !labels.includes('ci:run'))) {
              core.info('This pull request runs no CI yet; nothing to admit.');
              return;
            }
            const extra = JSON.parse(process.env.LABEL_LEGS || '{}');
            for (const label of labels) peak += extra[label] ?? 0;
          }

          // 'rest' carries on the wait 'room' began: its clock and its looks.
          const started = PHASE === 'rest' && Number(process.env.STARTED) > 0 ? Number(process.env.STARTED) : Date.now();
          const looked = PHASE === 'rest' ? Math.max(0, Number(process.env.LOOKS) || 0) : 0;
          core.setOutput('started', String(started));
          // The rest waits only when room measured that the run did not fit;
          // when room started on an API error or a low budget, so does the rest.
          if (PHASE === 'rest' && process.env.FITS !== 'false') {
            if (process.env.FITS === 'true') core.setOutput('wide', String(process.env.WIDE === 'true'));
            core.info(process.env.FITS === 'true' ? 'The whole run fit when its first job found room.' : 'Room did not measure the run; starting.');
            return;
          }
          let calls = 0;
          try {
            if (PHASE === 'rest') {
              // The next look falls where room planned it.
              const planned = Number(process.env.NEXT);
              // A look planned past the longest wait comes at its end instead.
              const left = MAX_WAIT_MS - (Date.now() - started);
              const next = Math.min((planned > 0 ? planned : started + Math.max(1, looked) * LOOK_MS) - Date.now(), left - JITTER_MS);
              // At its longest wait, a pull request decides on one more look
              // whether it may start (AT_LIMIT_SPACING_MS); other runs start.
              if ((looked >= MAX_LOOKS || left <= 0) && pr == null) {
                core.warning(`Still no room after ${MAX_WAIT_MS / 60_000} minutes; starting.`);
                return;
              }
              if (next > 0 && looked < MAX_LOOKS) await new Promise(resolve => setTimeout(resolve, next + Math.floor(Math.random() * JITTER_MS)));
            }
            // This run's own wait start on GitHub's clock (whole seconds), the
            // clock other runs' starts are read on: its first wait step as
            // GitHub recorded it, else its own clock floored to the second.
            // Read once, and only by a `main` run that sees another waiting.
            let ownStart;
            const ownWaitStart = async () => {
              if (ownStart !== undefined) return ownStart;
              ownStart = Math.floor(started / 1000) * 1000;
              try {
                calls += 1;
                const {data: {jobs: own}} = await github.rest.actions.listJobsForWorkflowRun({
                  ...context.repo, run_id: context.runId, filter: 'latest', per_page: 100,
                });
                const began = waitSpan(own.flatMap(job => job.steps ?? []).filter(step => step.name === STEP)).began;
                if (Number.isFinite(began)) ownStart = began;
              } catch {
                // The floored clock stands.
              }
              return ownStart;
            };
            // Looks that found no room; a look that only yielded to `main` is
            // not one of them.
            let spent = looked;
            for (let look = looked + 1; ; look += 1) {
              // A look that stops early (a low budget, a failed lookup) leaves
              // `fits` unset, so the rest starts rather than wait on an older look.
              core.setOutput('fits', '');
              core.setOutput('looks', String(spent + 1));
              const lookAt = await countLook({
                listRuns: async status => {
                  const {data, headers} = await github.rest.actions.listWorkflowRunsForRepo({
                    ...context.repo, status, per_page: 100,
                  });
                  return {runs: data.workflow_runs, remaining: Number(headers?.['x-ratelimit-remaining'])};
                },
                listJobs: async run_id => {
                  const {data: {jobs}} = await github.rest.actions.listJobsForWorkflowRun({
                    ...context.repo, run_id, filter: 'latest', per_page: 100,
                  });
                  return jobs;
                },
                selfId: context.runId,
                main,
                maxWaitMs: MAX_WAIT_MS,
                ownWaitStart,
              });
              calls += lookAt.calls;
              if (lookAt.lowBudget != null) {
                core.warning(`Only ${lookAt.lowBudget} API calls left this hour; starting without spending them.`);
                return;
              }
              const {others, small, smallBy, stale, counted, mainWaiting, pullWaiters, startedAtLimit} = lookAt;
              // Small workflows count at least their usual most (count.mjs).
              const smallCounted = others - lookAt.large;
              const smallList = Object.entries(smallBy).map(([name, count]) => `${name} ${count}`).join(', ');
              core.info(`Look ${look}: ${counted.join('; ') || 'no CI or Main runs'}. Small workflows ${small}${smallList ? ` (${smallList})` : ''}, counted as ${smallCounted}.${stale ? ` Ignored ${stale} stale run${stale === 1 ? '' : 's'}.` : ''}`);
              const fits = others + peak <= CI_CEILING && !mainWaiting;
              core.setOutput('fits', String(fits));
              if (fits) {
                // A run with no widening matrix has no full width to take.
                const wide = widen > 0 && others + peak + widen <= CI_CEILING;
                core.setOutput('wide', String(wide));
                core.info(`Room under the CI ceiling: about ${others} other jobs + ${peak} <= ${CI_CEILING}.${widen === 0 ? '' : wide ? ` Legs run at full width: + ${widen} <= ${CI_CEILING}.` : ` Legs run at tight width: + ${widen} > ${CI_CEILING}.`}`);
                return;
              }
              if (PHASE === 'room') {
                if (others + 1 <= CI_CEILING && !mainWaiting) {
                  // The rest of the run carries on this wait from this look.
                  const next = plan(others + peak - CI_CEILING, false);
                  core.setOutput('looks', String(spent + (next.spends ? 1 : 0)));
                  core.setOutput('next', String(Date.now() + next.interval));
                  core.info(`Room for the Storybook build: about ${others} other jobs + 1 <= ${CI_CEILING}; the rest of the run waits.`);
                  return;
                }
              }
              // Room for what this look admits, if no `main` check waited.
              const next = plan(others + (PHASE === 'room' ? 1 : peak) - CI_CEILING, mainWaiting);
              if (next.spends) spent += 1;
              core.setOutput('looks', String(spent));
              // The time left decides, not the look's own API time: a slow
              // look still waits the rest of the way for its next one.
              const left = MAX_WAIT_MS - (Date.now() - started);
              const wait = Math.min(next.interval + Math.floor(Math.random() * JITTER_MS), left);
              if (spent >= MAX_LOOKS || wait <= 0) {
                const why = `Still no room after ${MAX_WAIT_MS / 60_000} minutes (about ${others} other jobs${mainWaiting ? ', a main check waiting' : ''})`;
                if (pr == null) {
                  core.warning(`${why}; starting.`);
                  return;
                }
                // Wait starts compared on one clock: this run's own first wait
                // step as GitHub recorded it (whole seconds), else its clock
                // floored to the second; a tie goes to the lower run id.
                let mine = Math.floor(started / 1000) * 1000;
                try {
                  calls += 1;
                  const {data: {jobs: own}} = await github.rest.actions.listJobsForWorkflowRun({
                    ...context.repo, run_id: context.runId, filter: 'latest', per_page: 100,
                  });
                  const began = waitSpan(own.flatMap(job => job.steps ?? []).filter(step => step.name === STEP)).began;
                  if (Number.isFinite(began)) mine = began;
                } catch {
                  // The floored clock stands.
                }
                const waitedLonger = pullWaiters.filter(
                  other => other.began < mine || (other.began === mine && other.id < context.runId),
                ).length;
                if (startedAtLimit.length === 0 && waitedLonger === 0) {
                  core.warning(`${why}; starting, the one pull-request run to start at its longest wait for ${AT_LIMIT_SPACING_MS / 60_000} minutes.`);
                  // The whole run starts now, not only its Storybook build.
                  core.setOutput('fits', 'true');
                  return;
                }
                const other = startedAtLimit.length > 0
                  ? `run ${startedAtLimit[0].id} started at its longest wait ${Math.round(startedAtLimit[0].ago / 60_000)} minutes ago`
                  : `${waitedLonger} pull-request run${waitedLonger === 1 ? '' : 's'} that waited longer still wait${waitedLonger === 1 ? 's' : ''}`;
                core.setOutput('full', 'true');
                core.warning(`CI is full: ${why.charAt(0).toLowerCase()}${why.slice(1)}, and ${other}.`);
                return;
              }
              core.info(`Waiting for room: about ${others} other jobs + ${peak}${mainWaiting ? ', a main check waiting' : ''}.`);
              await new Promise(resolve => setTimeout(resolve, wait));
            }
          } catch (error) {
            core.warning(`Room under the CI ceiling could not be checked (${error.message}); starting.`);
          } finally {
            core.info(`CI admission: ${calls} API calls.`);
          }

    # Runs after any end of the wait, so the matrices always read a width.
    - id: widths
      if: always()
      shell: bash
      env:
        LEG_WIDTHS: ${{ inputs.leg-widths }}
        WIDE: ${{ steps.wait.outputs.wide }}
      run: |
        node -e '
          const widths = JSON.parse(process.env.LEG_WIDTHS || "{}");
          const pick = width => (process.env.WIDE === "true" ? width.full : width.tight);
          const chosen = Object.fromEntries(Object.entries(widths).map(([job, width]) => [job, pick(width)]));
          console.log(`widths=${JSON.stringify(chosen)}`);
        ' >> "$GITHUB_OUTPUT"
